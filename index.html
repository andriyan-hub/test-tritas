    const fmtId = (n) => Number(n).toLocaleString('id-ID');
    const DYN2 = {
      // BK.1 — Benar/Salah berbasis penelusuran biner (kunci dihitung)
      bs_tf() {
        const n = rndInt(7, 13), arr = rndUnique(n, 5, 99).sort((a, b) => a - b), target = arr[rndInt(0, n - 1)];
        const steps = bsTrace(arr, target), iter = steps.length, firstMid = steps[0].mid, seq = arr.indexOf(target) + 1;
        const st = [];
        const iterCand = [iter - 1, iter + 1, iter + 2].filter((v) => v >= 1 && v !== iter);
        const i1 = Math.random() < 0.5 ? iter : rndPick(iterCand);
        st.push({ text: 'Binary Search memeriksa elemen tengah sebanyak ' + i1 + ' kali sampai nilai ' + target + ' ditemukan.', answer: i1 === iter ? 'Benar' : 'Salah' });
        const m1 = Math.random() < 0.5 ? firstMid : firstMid + rndPick([-1, 1]);
        st.push({ text: 'Pada iterasi pertama, indeks mid bernilai ' + m1 + '.', answer: m1 === firstMid ? 'Benar' : 'Salah' });
        const s1 = Math.random() < 0.5 ? seq : seq + rndPick([1, 2]);
        st.push({ text: 'Sequential Search pada larik yang sama memerlukan ' + s1 + ' perbandingan untuk menemukan nilai tersebut.', answer: s1 === seq ? 'Benar' : 'Salah' });
        st.push(Math.random() < 0.5
          ? { text: 'Binary Search dapat dipakai pada larik ini karena datanya sudah terurut.', answer: 'Benar' }
          : { text: 'Sequential Search selalu lebih sedikit perbandingannya daripada Binary Search pada data terurut yang sangat besar.', answer: 'Salah' });
        return {
          type: 'pgk_kategori',
          prompt: 'Diberikan larik terurut (indeks mulai 0): [CODE:' + arr.join(', ') + ']. [CODE:Binary Search] mencari nilai ' + target + ' dengan mid = (low + high) dibagi 2 dibulatkan ke bawah. Tentukan Benar/Salah tiap pernyataan berikut:',
          statements: rndShuffle(st),
          pembahasan: 'Penelusuran: ' + bsText(steps) + '. Binary Search: ' + iter + ' pemeriksaan; mid pertama = ' + firstMid + '; Sequential Search: ' + seq + ' perbandingan (nilai ada di indeks ' + (seq - 1) + ').'
        };
      },
      // BK.2 — memilih strategi pencarian dari biaya langkah
      search_choose() {
        for (let tries = 0; tries < 50; tries++) {
          const n = rndPick([1000, 5000, 20000, 100000, 500000]), m = rndPick([1, 2, 3, 20, 100, 1000, 10000]), sorted = Math.random() < 0.4;
          const lg = Math.ceil(Math.log2(n)), cSeq = m * n, cSortBin = (n + m) * lg;
          let key;
          if (sorted) key = 'bin';
          else if (cSeq >= cSortBin * 1.5) key = 'sortbin';
          else if (cSortBin >= cSeq * 1.5) key = 'seq';
          else continue;
          const T = {
            seq: 'Sequential Search langsung pada data apa adanya',
            sortbin: 'Urutkan data terlebih dahulu, lalu gunakan Binary Search',
            bin: 'Binary Search langsung pada data apa adanya',
            copy: 'Salin seluruh data ke larik baru, lalu cari satu per satu'
          };
          const opts = rndShuffle(['seq', 'sortbin', 'bin', 'copy']);
          const why = sorted
            ? 'Data sudah terurut sehingga Binary Search (± ' + lg + ' langkah per pencarian) langsung tepat; mengurutkan ulang hanya menambah biaya.'
            : 'Perkiraan langkah: Sequential ≈ m × n = ' + fmtId(cSeq) + '; Urut + Binary ≈ (n + m) × ⌈log₂ n⌉ = ' + fmtId(cSortBin) + '. ' + (key === 'sortbin' ? 'Mengurutkan sekali lalu Binary Search lebih hemat.' : 'Karena pencarian sedikit, mengurutkan tidak sebanding; Sequential lebih hemat.') + ' Binary Search pada data tak terurut tidak valid.';
          return {
            type: 'pg',
            prompt: 'Sebuah aplikasi menyimpan ' + fmtId(n) + ' data ' + (sorted ? 'yang sudah terurut' : 'yang tidak terurut') + ' dan akan dicari sebanyak ' + fmtId(m) + ' kali. Strategi pencarian yang paling efisien adalah...',
            options: opts.map((k) => T[k]), correctIndex: opts.indexOf(key), pembahasan: why
          };
        }
        return DYN2.search_choose();
      },
      // AP.1 — penelusuran pseudocode perulangan
      trace_loop() {
        for (;;) {
          const a = rndInt(1, 4), b = rndInt(10, 20), s = rndInt(1, 3), m = rndPick([2, 3, 4, 5]);
          let total = 0; const hit = [];
          for (let i = a; i <= b; i += s) if (i % m === 0) { total += i; hit.push(i); }
          if (hit.length < 2) continue;
          return {
            type: 'isian',
            prompt: 'Perhatikan algoritma berikut:\n[CODE:total ← 0]\n[CODE:untuk i ← ' + a + ' sampai ' + b + ', naik ' + s + ':]\n[CODE:jika i mod ' + m + ' = 0 maka total ← total + i]\nBerapakah nilai total setelah perulangan selesai?',
            answerText: String(total),
            pembahasan: 'Nilai i yang dilalui: ' + (function () { const x = []; for (let i = a; i <= b; i += s) x.push(i); return x.join(', '); })() + '. Yang habis dibagi ' + m + ': ' + hit.join(', ') + '. Jumlah = ' + total + '.'
          };
        }
      },
      // AP.1 — banyak iterasi (kondisi berhenti / loop guard)
      loop_count() {
        const a = rndInt(0, 5), s = rndInt(1, 4), strict = Math.random() < 0.5, b = a + s * rndInt(3, 8) + rndInt(0, s - 1);
        const vals = []; for (let i = a; strict ? i < b : i <= b; i += s) vals.push(i);
        const ans = vals.length;
        const set = [ans]; [ans - 1, ans + 1, ans + 2, ans - 2].forEach((v) => { if (v > 0 && set.length < 4 && set.indexOf(v) < 0) set.push(v); });
        const opts = rndShuffle(set);
        return {
          type: 'pg',
          prompt: 'Perhatikan algoritma berikut:\n[CODE:i ← ' + a + ']\n[CODE:selama i ' + (strict ? '<' : '≤') + ' ' + b + ':]\n[CODE:proses(i); i ← i + ' + s + ']\nBerapa kali [CODE:proses(i)] dipanggil?',
          options: opts.map((v) => v + ' kali'), correctIndex: opts.indexOf(ans),
          pembahasan: 'Nilai i yang memenuhi syarat: ' + vals.join(', ') + ' → ' + ans + ' kali. Perhatikan beda tanda ' + (strict ? '"<" (batas tidak ikut)' : '"≤" (batas ikut)') + ' pada kondisi berhenti.'
        };
      },
      // AP.2 — bug indeks (off-by-one) pada pencarian nilai maksimum
      bug_trace() {
        const n = rndInt(6, 9), vals = rndUnique(n, 10, 99), mx = Math.max.apply(null, vals);
        const rest = rndShuffle(vals.filter((v) => v !== mx));
        const skipFirst = Math.random() < 0.5;
        const arr = skipFirst ? [mx].concat(rest) : rest.concat([mx]);
        const got = skipFirst ? Math.max.apply(null, arr.slice(1)) : Math.max.apply(null, arr.slice(0, n - 1));
        const code = skipFirst
          ? '[CODE:maks ← arr[1]]\n[CODE:untuk i ← 1 sampai ' + (n - 1) + ':]\n[CODE:jika arr[i] > maks maka maks ← arr[i]]\n[CODE:kembalikan maks]'
          : '[CODE:maks ← arr[0]]\n[CODE:untuk i ← 0 sampai ' + (n - 2) + ':]\n[CODE:jika arr[i] > maks maka maks ← arr[i]]\n[CODE:kembalikan maks]';
        return {
          type: 'isian',
          prompt: 'Fungsi berikut dimaksudkan mencari nilai terbesar pada larik [CODE:arr] (indeks mulai 0, panjang ' + n + '): [CODE:' + arr.join(', ') + ']\n' + code + '\nBerapakah nilai yang sebenarnya dikembalikan fungsi ini?',
          answerText: String(got),
          pembahasan: (skipFirst ? 'Inisialisasi dan perulangan mulai dari indeks 1, sehingga arr[0] = ' + mx + ' tidak pernah dibandingkan.' : 'Perulangan berhenti di indeks ' + (n - 2) + ', sehingga elemen terakhir arr[' + (n - 1) + '] = ' + mx + ' tidak diperiksa.') + ' Hasil = ' + got + ' (nilai terbesar sebenarnya ' + mx + '). Perbaikan: perulangan mencakup seluruh indeks 0 sampai ' + (n - 1) + '.'
        };
      },

      ad_clean() {
        const k = rndInt(5, 7), uniq = rndUnique(k, 10, 99);
        const items = uniq.slice();
        for (let i = 0; i < rndInt(2, 3); i++) items.push(rndPick(uniq));
        const blanks = rndInt(2, 3);
        for (let i = 0; i < blanks; i++) items.push('-');
        const shuf = rndShuffle(items);
        return {
          type: 'isian',
          prompt: 'Data hasil survei: [CODE:' + shuf.join(', ') + ']. Tanda "-" berarti nilai kosong. Setelah menghapus nilai kosong dan data ganda (nilai yang sama hanya dihitung satu kali), berapa banyak data yang tersisa?',
          answerText: String(k),
          pembahasan: 'Nilai kosong ("-") dibuang: ' + blanks + ' buah. Nilai unik yang tersisa: ' + uniq.slice().sort((a, b) => a - b).join(', ') + ' → ' + k + ' data.'
        };
      },
      // AD.2 — persentase perubahan
      ad_percent() {
        const A = 20 * rndInt(2, 15), k = 5 * rndInt(2, 12), up = Math.random() < 0.6, B = up ? A + A * k / 100 : A - A * k / 100;
        return {
          type: 'isian',
          prompt: 'Jumlah unduhan dataset terbuka sebuah portal ' + (up ? 'naik' : 'turun') + ' dari ' + A + ' pada bulan lalu menjadi ' + B + ' pada bulan ini. Berapa persen ' + (up ? 'kenaikan' : 'penurunan') + ' tersebut? (tulis angkanya saja)',
          answerText: String(k),
          pembahasan: 'Selisih = |' + B + ' − ' + A + '| = ' + Math.abs(B - A) + '. Persentase = ' + Math.abs(B - A) + ' ÷ ' + A + ' × 100% = ' + k + '%.'
        };
      },
      // AD.2 — mengenali risiko bias data
      ad_bias() {
        const n1 = rndInt(25, 80), n2 = rndInt(3, 8);
        const L = {
          samp: 'Bias sampel (sampel tidak mewakili populasi)',
          surv: 'Bias penyintas (hanya data yang bertahan yang dianalisis)',
          corr: 'Korelasi dianggap sebab-akibat',
          old: 'Data kedaluwarsa (tidak relevan dengan kondisi sekarang)',
          small: 'Ukuran sampel terlalu kecil',
          cherry: 'Bias konfirmasi (memilih data yang mendukung dugaan)'
        };
        const SC = [
          { k: 'samp', t: 'Survei kepuasan siswa hanya dibagikan lewat grup WhatsApp OSIS dan dijawab ' + n1 + ' anggota, lalu hasilnya disimpulkan mewakili seluruh siswa sekolah.' },
          { k: 'surv', t: 'Analisis "rahasia sukses" hanya memakai data perusahaan rintisan yang masih beroperasi, sedangkan yang sudah tutup diabaikan.' },
          { k: 'corr', t: 'Data menunjukkan penjualan es krim dan jumlah kasus kulit terbakar sama-sama naik, lalu disimpulkan es krim menyebabkan kulit terbakar.' },
          { k: 'old', t: 'Prediksi permintaan aplikasi tahun ini memakai dataset ' + rndInt(6, 10) + ' tahun lalu tanpa pembaruan, padahal perilaku pengguna berubah drastis.' },
          { k: 'small', t: 'Rata-rata tinggi badan siswa se-Indonesia disimpulkan dari pengukuran ' + n2 + ' siswa dari satu kelas.' },
          { k: 'cherry', t: 'Seorang peneliti hanya menyimpan jawaban responden yang mendukung hipotesisnya dan membuang jawaban yang bertentangan.' }
        ];
        const sc = rndPick(SC);
        const others = rndShuffle(Object.keys(L).filter((x) => x !== sc.k)).slice(0, 3);
        const opts = rndShuffle([sc.k].concat(others));
        return {
          type: 'pg',
          prompt: sc.t + ' Risiko utama yang paling tepat pada analisis tersebut adalah...',
          options: opts.map((x) => L[x]), correctIndex: opts.indexOf(sc.k),
          pembahasan: 'Ciri pada skenario mengarah ke: ' + L[sc.k] + '. Rekomendasi: perluas/acak pengambilan data, periksa sumber dan keterbaruan data, serta uji penjelasan lain sebelum mengambil keputusan.'
        };
      },
      // HE.1 — membaca lateral
      he_verify() {
        const claims = [
          'Situs "InfoTerkini24" memuat berita bahwa seluruh sekolah di Indonesia akan libur dua bulan mulai pekan depan.',
          'Sebuah unggahan viral menyatakan aplikasi dompet digital membagikan saldo Rp500.000 bagi siapa pun yang membagikan tautan ke 10 grup.',
          'Sebuah artikel tanpa nama penulis mengklaim penelitian terbaru membuktikan belajar malam hari selalu menurunkan nilai ujian.',
          'Akun anonim menulis bahwa sebuah platform belajar daring akan dihentikan besok dan semua data pengguna dihapus.'
        ];
        const good = rndPick([
          'Membuka tab baru dan mencari tahu siapa atau lembaga di balik sumber tersebut serta apa kata sumber independen lain (membaca lateral)',
          'Meninggalkan halaman itu sejenak, lalu mencari klaim yang sama di beberapa sumber tepercaya yang berbeda untuk dibandingkan'
        ]);
        const bad = rndShuffle([
          'Melihat jumlah suka dan komentar; semakin banyak berarti semakin benar',
          'Membaca seluruh artikel di halaman yang sama dengan teliti untuk menilai kredibilitasnya',
          'Menilai dari tampilan situs yang rapi dan minim iklan',
          'Membagikannya dulu ke teman agar bisa dikoreksi bersama',
          'Mempercayainya karena judulnya memakai kata "resmi" atau "terbukti"'
        ]).slice(0, 3);
        const opts = rndShuffle([good].concat(bad));
        return {
          type: 'pg',
          prompt: 'Kamu menemukan klaim berikut: "' + rndPick(claims) + '" Sumbernya belum pernah kamu kenal. Langkah verifikasi yang paling tepat adalah...',
          options: opts, correctIndex: opts.indexOf(good),
          pembahasan: 'Membaca lateral berarti keluar dari halaman sumber dan memeriksa reputasi sumber serta klaimnya lewat sumber lain. Popularitas, tampilan, dan kata-kata meyakinkan bukan bukti kebenaran.'
        };
      },
      // HE.1 — praktik keamanan akun (PG kompleks)
      he_safe() {
        const safe = ['Mengaktifkan verifikasi dua langkah (2FA) pada akun penting', 'Memakai kata sandi unik dan panjang untuk setiap akun dengan bantuan pengelola kata sandi', 'Memeriksa alamat pengirim dan tautan sebelum mengklik email yang meminta data login', 'Memperbarui sistem operasi dan aplikasi secara berkala', 'Keluar (logout) dari akun setelah memakai komputer umum'];
        const unsafe = ['Memakai kata sandi yang sama di semua akun agar mudah diingat', 'Memberikan kode OTP kepada pihak yang mengaku petugas bank', 'Mengklik tautan hadiah dari nomor tak dikenal untuk mengecek isinya', 'Menyimpan foto KTP di folder publik yang dapat dibuka siapa saja', 'Menonaktifkan pembaruan keamanan agar perangkat terasa lebih cepat'];
        const ns = rndInt(2, 3);
        const picked = rndShuffle(safe).slice(0, ns).map((t) => ({ t, ok: true })).concat(rndShuffle(unsafe).slice(0, 5 - ns).map((t) => ({ t, ok: false })));
        const sh = rndShuffle(picked);
        return {
          type: 'pg_kompleks',
          prompt: 'Pilih semua praktik yang AMAN untuk melindungi akun dan data pribadi:',
          options: sh.map((x) => x.t), correctIndices: sh.map((x, i) => (x.ok ? i : -1)).filter((i) => i >= 0),
          pembahasan: 'Praktik aman: ' + sh.filter((x) => x.ok).map((x) => x.t).join('; ') + '. Sisanya meningkatkan risiko pencurian akun atau data.'
        };
      },
      // HE.2 — izin penggunaan menurut lisensi Creative Commons (kunci dihitung dari aturan lisensi)
      he_license() {
        const LIC = {
          'CC BY': { nc: false, nd: false, sa: false, attr: true },
          'CC BY-SA': { nc: false, nd: false, sa: true, attr: true },
          'CC BY-NC': { nc: true, nd: false, sa: false, attr: true },
          'CC BY-ND': { nc: false, nd: true, sa: false, attr: true },
          'CC BY-NC-ND': { nc: true, nd: true, sa: false, attr: true },
          'CC0': { nc: false, nd: false, sa: false, attr: false }
        };
        const ACT = [
          { lic: ['CC BY', 'CC BY-SA', 'CC BY-NC', 'CC0'], t: (l) => 'Karya berlisensi ' + l + ' dipakai pada poster yang dijual (komersial) dengan mencantumkan nama pencipta.', ok: (L) => !L.nc },
          { lic: ['CC BY', 'CC BY-ND', 'CC BY-NC-ND', 'CC0'], t: (l) => 'Karya berlisensi ' + l + ' diubah (remix) lalu disebarkan dengan mencantumkan nama pencipta.', ok: (L) => !L.nd },
          { lic: ['CC BY', 'CC BY-SA', 'CC BY-NC', 'CC0'], t: (l) => 'Karya berlisensi ' + l + ' dibagikan ulang tanpa mencantumkan nama pencipta.', ok: (L) => !L.attr },
          { lic: ['CC BY', 'CC BY-SA', 'CC0'], t: (l) => 'Hasil remix dari karya berlisensi ' + l + ' disebarkan dengan lisensi yang berbeda dari lisensi aslinya, dengan menyebut nama pencipta.', ok: (L) => !L.sa },
          { lic: Object.keys(LIC), t: (l) => 'Karya berlisensi ' + l + ' dibagikan ulang tanpa perubahan untuk keperluan nonkomersial dengan mencantumkan nama pencipta.', ok: () => true }
        ];
        for (let tries = 0; tries < 50; tries++) {
          const acts = rndShuffle(ACT).slice(0, 4);
          const st = acts.map((a) => { const l = rndPick(a.lic); return { text: a.t(l), answer: a.ok(LIC[l]) ? 'Benar' : 'Salah' }; });
          const nb = st.filter((x) => x.answer === 'Benar').length;
          if (nb === 0 || nb === st.length) continue;
          return {
            type: 'pgk_kategori',
            prompt: 'Tentukan apakah tindakan berikut DIPERBOLEHKAN menurut ketentuan lisensi Creative Commons yang disebutkan (Benar = diperbolehkan):',
            statements: st,
            pembahasan: 'Ketentuan: BY = wajib mencantumkan pencipta; SA = turunan wajib berlisensi sama; NC = hanya nonkomersial; ND = tidak boleh diubah; CC0 = pencipta melepas hak (tanpa atribusi).'
          };
        }
        return DYN2.he_license();
      },
      // HE.2 — menjodohkan lisensi dengan ketentuannya
      jodoh_cc() {
        const P = [
          { left: 'CC BY', right: 'Boleh dipakai dan diubah, wajib mencantumkan pencipta' },
          { left: 'CC BY-SA', right: 'Turunan karya wajib dilisensikan sama seperti aslinya' },
          { left: 'CC BY-NC', right: 'Hanya boleh untuk tujuan nonkomersial' },
          { left: 'CC BY-ND', right: 'Boleh dibagikan tetapi tidak boleh diubah' },
          { left: 'CC0', right: 'Hak dilepas pencipta; bebas dipakai tanpa atribusi' }
        ];
        return {
          type: 'menjodohkan',
          prompt: 'Pasangkan lisensi Creative Commons berikut dengan ketentuan utamanya:',
          pairs: rndShuffle(P).slice(0, 4),
          pembahasan: 'BY = atribusi; SA = berbagi serupa; NC = nonkomersial; ND = tanpa turunan; CC0 = domain publik.'
        };
      }
    };
    DYN_KINDS.push(
      { id: 'bs_tf', label: 'Binary & Sequential Search: Benar/Salah hasil penelusuran', type: 'pgk_kategori', atp: 'ATP-XI.BK.1' },

    );

    // =========================================================================
    // v8: PEMBUAT SOAL OTOMATIS + BAKI DRAF — satu pintu untuk semua sumber soal
    // (template, sebar otomatis, dinamis, impor Word/teks/AI, Excel) -> periksa -> bank
    // =========================================================================
    const GEN_TYPES = ['pg', 'pg_kompleks', 'pgk_kategori', 'menjodohkan', 'isian', 'esai'];
    const GEN_TYPE_LABEL = { pg: 'Pilihan Ganda (PG)', pg_kompleks: 'PG Kompleks', pgk_kategori: 'Benar/Salah', menjodohkan: 'Menjodohkan', isian: 'Isian Singkat', esai: 'Uraian / Esai' };
    const GEN_TYPE_SHORT = { pg: 'PG', pg_kompleks: 'PGK', pgk_kategori: 'B/S', menjodohkan: 'Jodoh', isian: 'Isian', esai: 'Esai' };
    const SUMBER_LABEL = { template: 'Template', dinamis: 'Dinamis', impor: 'Impor Teks/AI', excel: 'Excel', manual: 'Manual' };
    function rndPick(a) { return a[rndInt(0, a.length - 1)]; }

    // ---- Kunci duplikat tunggal: topik + teks soal (dipakai Bank, Impor, Excel, Generator) ----
    function qSig(q) { // isi jawaban ikut dibandingkan agar soal bersampul sama tetapi opsi/pernyataan berbeda tidak dianggap kembar
      const n = (x) => String(x || '').trim().toLowerCase().replace(/\s+/g, ' ');
      if (q.type === 'pg' || q.type === 'pg_kompleks') return (q.options || []).map(n).sort().join('~');
      if (q.type === 'pgk_kategori') return (q.statements || []).map((x) => n(x.text)).sort().join('~');
      if (q.type === 'menjodohkan') return (q.pairs || []).map((x) => n(x.left) + '>' + n(x.right)).sort().join('~');
      return '';
    }
    function qKey(q) { return topikOf(q) + '||' + normPrompt(q.prompt) + '||' + qSig(q); }

    // ---- Validasi butir sebelum masuk bank ----
    function validateQuestion(q) {
      const errors = [], warnings = [];
      if (!String(q.prompt || '').trim()) errors.push('teks soal kosong');
      if (!(Number(q.points) >= 1)) errors.push('poin kurang dari 1');
      const opts = q.options || [];
      if (q.type === 'pg' || q.type === 'pg_kompleks') {
        if (opts.length < 2) errors.push('opsi kurang dari 2');
        if (opts.some((o) => !String(o).trim())) errors.push('ada opsi kosong');
        const n = opts.map((o) => String(o).trim().toLowerCase());
        if (n.some((x, i) => n.indexOf(x) !== i)) errors.push('ada opsi kembar');
        if (q.type === 'pg') {
          const c = Number(q.correctIndex);
          if (!(c >= 0 && c < opts.length)) errors.push('kunci PG tidak valid');
        } else {
          const ci = q.correctIndices || [];
          if (!ci.length || ci.some((i) => !(i >= 0 && i < opts.length))) errors.push('kunci PG kompleks kosong/tidak valid');
        }
      } else if (q.type === 'pgk_kategori') {
        const st = q.statements || [];
        if (st.length < 1) errors.push('belum ada pernyataan');
        if (st.some((x) => !String(x.text || '').trim())) errors.push('ada pernyataan kosong');
        if (st.some((x) => x.answer !== 'Benar' && x.answer !== 'Salah')) errors.push('kunci Benar/Salah tidak valid');
      } else if (q.type === 'menjodohkan') {
        const pr = q.pairs || [];
        if (pr.length < 2) errors.push('minimal 2 pasangan');
        if (pr.some((x) => !String(x.left || '').trim() || !String(x.right || '').trim())) errors.push('ada pasangan kosong');
      } else if (q.type === 'isian') {
        if (!String(q.answerText || '').trim()) errors.push('kunci isian kosong');
      } else if (q.type === 'esai') {
        if (!String(q.pembahasan || q.answerText || '').trim()) warnings.push('esai belum punya rubrik');
      }
      return { errors, warnings };
    }

    // ---- Excel: konversi dua arah, termasuk Benar/Salah & Menjodohkan (kolom "butir") ----
    function encItems(q) {
      if (q.type === 'pgk_kategori') return (q.statements || []).map((x) => x.text + ' => ' + x.answer).join('\n');
      if (q.type === 'menjodohkan') return (q.pairs || []).map((p) => p.left + ' => ' + p.right).join('\n');
      return '';
    }
    function decItems(str, type) {
      const out = [];
      String(str || '').replace(/\r/g, '').split('\n').forEach((ln) => {
        ln = ln.trim().replace(/^[-*•]\s*/, '');
        if (!ln) return;
        const i = type === 'pgk_kategori' ? ln.lastIndexOf('=>') : ln.indexOf('=>');
        if (i < 0) return;
        const l = ln.slice(0, i).trim(), r = ln.slice(i + 2).trim();
        if (!l || !r) return;
        if (type === 'pgk_kategori') out.push({ text: l, answer: /^(benar|b|true)$/i.test(r) ? 'Benar' : 'Salah' });
        else out.push({ left: l, right: r });
      });
      return out;
    }
    function questionToExcelRow(q, idx) {
      const meta = (state.topikMeta || {})[topikOf(q)] || {};
      const o = q.options || [];
      const L = (i) => String.fromCharCode(65 + i);
      let kunci = '';
      if (q.type === 'pg') kunci = L(Number(q.correctIndex || 0));
      else if (q.type === 'pg_kompleks') kunci = (q.correctIndices || []).map((i) => L(Number(i))).join(',');
      else kunci = q.answerText || '';
      return {
        no: idx + 1, id: q.id, type: q.type, atp: getQuestionAtp(q), kd: q.kd || '', topik: topikOf(q),
        jenis_asesmen: meta.jenis || '', pengalaman_belajar: meta.pengalaman || '', level: q.levelKognitif || '',
        tp: q.tp || '', indikator: q.indikator || '', prompt: q.prompt,
        opsiA: o[0] || '', opsiB: o[1] || '', opsiC: o[2] || '', opsiD: o[3] || '', opsiE: o[4] || '', opsiF: o[5] || '',
        kunci, butir: encItems(q), points: q.points || 10, pembahasan: q.pembahasan || '', sumber: q.sumber || ''
      };
    }
    function excelRowToQuestion(r, idx) {
      const g = (...ks) => { for (const k of ks) { if (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') return String(r[k]).trim(); } return ''; };
      const prompt = g('prompt', 'Prompt', 'Pertanyaan', 'Soal');
      if (!prompt) return { q: null, err: '' };
      let type = g('type', 'Tipe', 'tipe').toLowerCase();
      if (GEN_TYPES.indexOf(type) < 0) type = ({ pgk: 'pg_kompleks', bs: 'pgk_kategori', jodoh: 'menjodohkan' })[type] || 'pg';
      const kdRaw = g('atp', 'ATP', 'kd', 'KD');
      const atpCode = ((kdRaw.match(/ATP-[A-Z]+\.[A-Z]+\.\d+/i) || [''])[0]).toUpperCase();
      const atpObj = atpCode ? impAtpList().find((a) => a.kode.toUpperCase() === atpCode) : null;
      const q = { id: 'Q_XLS_' + Date.now() + '_' + idx + '_' + rndInt(0, 9999), type, prompt, points: Number(g('points', 'Poin', 'poin')) || IMP_DEF_PTS[type] || 10, sumber: 'excel' };
      if (atpObj) { q.kd = atpObj.kode + ' • ' + atpObj.elemen; q.atpKode = atpObj.kode; q.tp = atpObj.tp; q.indikator = atpObj.indikator; }
      else q.kd = kdRaw || 'Umum';
      const lv = g('level', 'Level');
      if (/dasar/i.test(lv)) q.levelKognitif = 'Dasar'; else if (/menengah/i.test(lv)) q.levelKognitif = 'Menengah'; else if (/hots/i.test(lv)) q.levelKognitif = 'HOTS & Analisis';
      const tp = g('topik', 'Topik').replace(/\s+/g, ' ');
      if (tp) q.topik = tp;
      const pb = g('pembahasan', 'Pembahasan', 'Rubrik', 'rubrik');
      if (pb) q.pembahasan = pb;
      const key = g('kunci', 'Kunci');
      if (type === 'pg' || type === 'pg_kompleks') {
        const opts = ['A', 'B', 'C', 'D', 'E', 'F'].map((L) => g('opsi' + L, 'Opsi' + L, L)).filter(Boolean);
        if (opts.length < 2) return { q: null, err: 'opsi kurang dari 2' };
        q.options = opts;
        const letters = Array.from(new Set((key.toUpperCase().match(/[A-F]/g) || []))).map((l) => l.charCodeAt(0) - 65).filter((i) => i < opts.length);
        if (type === 'pg') {
          if (letters.length !== 1) return { q: null, err: 'kunci PG harus satu huruf yang sesuai opsi' };
          q.correctIndex = letters[0];
        } else {
          if (!letters.length) return { q: null, err: 'kunci PG kompleks kosong (contoh: A,C)' };
          q.correctIndices = letters.sort((x, y) => x - y);
        }
      } else if (type === 'pgk_kategori' || type === 'menjodohkan') {
        const items = decItems(g('butir', 'Butir', 'items'), type);
        if (items.length < (type === 'menjodohkan' ? 2 : 1)) return { q: null, err: 'kolom "butir" kosong/format salah (tulis "kiri => kanan" per baris)' };
        if (type === 'pgk_kategori') q.statements = items; else q.pairs = items;
      } else if (type === 'isian') {
        if (!key) return { q: null, err: 'kunci isian kosong' };
        q.answerText = key;
      } else if (key) q.answerText = key;
      return { q };
    }

    // ---- Baki draf: semua sumber masuk lewat sini ----
    window.__addToTray = function (items, sumber, errs, note) {
      if (!Array.isArray(state.autoSoalDraft)) state.autoSoalDraft = [];
      const tray = state.autoSoalDraft;
      const bank = new Set(visibleQuestions().map(qKey));
      const inTray = new Set(tray.map(qKey));
      let added = 0, dupBank = 0, dupTray = 0;
      (items || []).forEach((q, i) => {
        if (q.topik) q.topik = canonTopik(q.topik);
        const k = qKey(q);
        if (inTray.has(k)) { dupTray++; return; }
        inTray.add(k);
        const isDup = bank.has(k);
        if (isDup) dupBank++;
        const { owner, ...rest } = q;
        tray.push({ ...rest, id: 'DRAFT_' + Date.now() + '_' + i + '_' + rndInt(0, 99999), sumber: q.sumber || sumber, selected: !isDup });
        added++;
      });
      saveState();
      window.__scrollTray = added > 0;
      if (added > 0) window.__bankSub = 'draf';
      renderAdminView();
      const bits = [added + ' soal masuk Baki Draf'];
      if (dupBank) bits.push(dupBank + ' sudah ada di bank (tidak dicentang)');

        });

      };

      const body = rows.map((r) => {

        if (r.key === '_none' && !b.n && !t.n) return '';
        const empty = !b.n && !t.n;
        const cells = GEN_TYPES.map((ty) => {
          const bn = b.t[ty] || 0, tn = t.t[ty] || 0;
          return `<td class="px-2 py-1.5 text-center font-mono ${bn + tn === 0 ? 'text-slate-300' : 'text-slate-800 font-bold'}">${bn || (tn ? '' : '·')}${tn ? `<span class="text-emerald-700"> +${tn}</span>` : ''}</td>`;
        }).join('');
        return `<tr class="border-t border-slate-100 ${empty && r.key !== '_none' ? 'bg-amber-50' : ''}"><td class="px-2 py-1.5 font-bold text-slate-800 whitespace-nowrap">${escapeHtml(r.label)}<span class="block text-[10px] font-medium text-slate-500">${escapeHtml(r.sub)}</span></td>${cells}<td class="px-2 py-1.5 text-center font-mono font-bold">${b.n}${t.n ? `<span class="text-emerald-700"> +${t.n}</span>` : ''}</td><td class="px-2 py-1.5 text-center font-mono text-[11px] text-slate-600">D${b.lv.D} M${b.lv.M} H${b.lv.H}${b.lv.X ? ' ?' + b.lv.X : ''}</td></tr>`;
      }).join('');
      return `<details class="rounded-xl border border-slate-200 bg-white" ${missing ? 'open' : ''}>

    function typesAvailableForAtp(atp) {
      const T = getAutoSoalTemplates();
      const set = new Set();
      GEN_TYPES.forEach((t) => { if (((T[atp.elemenId] || {})[t] || []).length) set.add(t); });
      DYN_KINDS.forEach((k) => { if (k.atp === atp.kode) set.add(k.type); });
      return GEN_TYPES.filter((t) => set.has(t));
    }

    // ---- Sebar otomatis: N soal dibagi merata ke ATP, tipe bergilir ----
    function sebarGenerate(cfg, N, types, topik) {
      const pool = genAtpPool(cfg);
      const T = getAutoSoalTemplates();
      const used = new Set();
      const seen = new Set(visibleQuestions().concat(state.autoSoalDraft || []).map(qKey));
      const out = [];
      const pts = (t) => Math.max(1, Number((cfg.pointsByType || {})[t]) || IMP_DEF_PTS[t] || 10);
      const trySource = (atp, t) => {
        const list = (T[atp.elemenId] || {})[t] || [];
        for (let k = 0; k < list.length; k++) {
          const key = atp.elemenId + '|' + t + '|' + k;
          if (used.has(key)) continue;
          used.add(key);
          const it = buildTemplateItem(atp, t, list[k], cfg, pts(t), out.length);
          if (topik) it.topik = topik; // v9: kosong = ditanyakan saat dimasukkan ke bank
          if (seen.has(qKey(it))) continue;
          seen.add(qKey(it));
          return it;
        }
        const kinds = DYN_KINDS.filter((kd) => kd.atp === atp.kode && kd.type === t);
        if (kinds.length) {
          for (let a = 0; a < 25; a++) {
            const it = buildDynDraft(rndPick(kinds).id, topik, pts(t), out.length);
            if (!seen.has(qKey(it))) { seen.add(qKey(it)); return it; }
          }
        }
        return null;
      };
      let ti = 0;
      for (let k = 0; k < N; k++) {
        let made = null;
        for (let a2 = 0; a2 < pool.length && !made; a2++) {
          const atp = pool[(k + a2) % pool.length];
          for (let j = 0; j < types.length && !made; j++) {
            const t = types[(ti + j) % types.length];
            made = trySource(atp, t);
            if (made) ti = (ti + j + 1) % types.length;
          }
        }
        if (made) out.push(made);
      }
      return out;
    }

    (function () {

    // =========================================================================
    // CLOUD SYNC — penyimpanan terpusat Google Sheets (Apps Script)
    // Aktif hanya bila CLOUD_URL diisi. Kosong = mode lokal seperti sebelumnya.
    // =========================================================================
    (function () {
      if (!CLOUD_URL) return;

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let deviceId = localStorage.getItem('tritas_device_id');
      if (!deviceId) {
        deviceId = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('tritas_device_id', deviceId);
      }
      let adminKey = sessionStorage.getItem('tritas_admin_key') || '';
      window.__cloudUser = (() => { try { return JSON.parse(sessionStorage.getItem('tritas_admin_user') || 'null'); } catch (e) { return null; } })();
      let adminSynced = false;

      // ---------- util ----------
      async function call(action, payload, timeoutMs) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
        try {
          const res = await fetch(CLOUD_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(Object.assign({ action }, payload || {})),
            signal: ctrl.signal
          });
          return await res.json();
        } finally {
          clearTimeout(t);
        }
      }
      function pill(text, kind) {
        let el = document.getElementById('cloudPill');
        if (!el) {
          el = document.createElement('div');
          el.id = 'cloudPill';
          el.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;padding:4px 10px;border-radius:999px;font:600 11px system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:default';
          document.body.appendChild(el);
        }
        const c = kind === 'err' ? ['#fee2e2', '#991b1b'] : kind === 'busy' ? ['#fef3c7', '#92400e'] : ['#dcfce7', '#166534'];
        el.style.background = c[0];
        el.style.color = c[1];
        el.textContent = text;
      }
      const clock = () => new Date().toLocaleTimeString('id-ID');
      const isAuthErr = (res) => res && res.error && /AUTH/.test(res.error);

      // ---------- ADMIN: data & diff ----------
      const SKIP = ['questions', 'students', 'submissions', 'session', 'adminTab', 'autoSoalDraft', 'studentsSeedVersion', 'adminUser', 'adminPass', 'logFilter'];
      const rosterOf = (st) => {
        const c = Object.assign({}, st);
        ['status', 'locked', 'violations', 'violationLogs', 'lastActive'].forEach((k) => delete c[k]);
        return c;
      };
      function masterOf() {
        const s = {};
        Object.keys(state).forEach((k) => { if (SKIP.indexOf(k) < 0) s[k] = state[k]; });
        s.antiCheat = Object.assign({}, state.antiCheat, { logs: [] });
        return { settings: s, questions: state.questions, students: state.students.map(rosterOf) };
      }
      const stKey = (s) => JSON.stringify([s.status || 'belum', !!s.locked, Number(s.violations) || 0]);
      const base = { master: '', st: {}, subs: {}, logIds: new Set() };
      let pushTimer = null, pushing = false, dirty = false, dirtySeq = 0, lastSig = '';

      function applyPull(res, withMaster) {
        let roster;
        if (withMaster && res.master) {
          const m = res.master;
          Object.assign(state, m.settings || {});
          if (!(m.settings && Array.isArray(m.settings.kelasGuru))) state.kelasGuru = [];
          state.antiCheat = Object.assign({}, createInitialState().antiCheat, (m.settings && m.settings.antiCheat) || {});
          if (Array.isArray(m.questions)) state.questions = m.questions;
          roster = Array.isArray(m.students) ? m.students : [];
        } else {
          roster = state.students.map(rosterOf);
        }
        const smap = new Map((res.status || []).map((x) => [String(x.nis).trim(), x]));
        state.students = roster.map((r) => {
          const s = smap.get(String(r.nis).trim()) || {};
          let vl = [];
          try { vl = s.violationLogs ? JSON.parse(s.violationLogs) : []; } catch (e) { vl = []; }
          return Object.assign({}, r, {
            status: s.status || 'belum',
            locked: s.locked === true || s.locked === 'true',
            violations: Number(s.violations) || 0,
            violationLogs: vl,
            lastActive: s.lastActive || null
          });
        });
        state.submissions = res.submissions || [];
        state.antiCheat.logs = res.logs || [];
        base.st = {};
        state.students.forEach((s) => { base.st[s.nis] = stKey(s); });
        base.subs = {};
        state.submissions.forEach((s) => { base.subs[String(s.nis)] = JSON.stringify(s); });
        base.logIds = new Set((res.logs || []).map((l) => l.id));
        base.master = JSON.stringify(masterOf());
      }

      // Ruang kerja guru baru: kosongkan data lokal (jangan mewarisi soal/siswa guru lain di perangkat ini).
      function resetWorkspace() {
        const fresh = createInitialState();
        Object.keys(fresh).forEach((k) => { if (SKIP.indexOf(k) < 0) state[k] = fresh[k]; });
        state.questions = []; state.students = []; state.submissions = [];
        state.autoSoalDraft = fresh.autoSoalDraft;
        state.kelasGuru = [];
        const tok = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'.charAt(Math.floor(Math.random() * 32))).join('');
        state.examToken = tok;
        state.tokenHistory = [{ token: tok, createdAt: new Date().toLocaleTimeString('id-ID'), mode: 'Awal' }];
        state.testName = 'Penilaian Baru';
        state.antiCheat = Object.assign({}, fresh.antiCheat, { logs: [] });
      }
      window.__cloudFlush = async function () {
        if (!adminKey || !adminSynced) return;
        if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
        if (dirty || pushing) { for (let i = 0; i < 3 && (dirty || pushing); i++) { await doPush(); await sleep(300); } }
      };
      window.__cloudGuru = (action, payload) => call(action, Object.assign({ key: adminKey }, payload || {}));

      async function initialAdminPull() {
        const res = await call('adminPull', { key: adminKey });
        if (!res.ok) throw new Error(res.error || 'Gagal memuat data');
        if (res.user) { window.__cloudUser = res.user; try { sessionStorage.setItem('tritas_admin_user', JSON.stringify(res.user)); } catch (e) { /* abaikan */ } }
        if (res.master) {
          applyPull(res, true);
          // v13: bank bawaan lama di server (Q1-Q7 utuh) diganti 40 soal Pekan Ulangan, lalu otomatis disimpan kembali
          { const before = JSON.stringify(masterOf()); try { migrateV9(); migrateV10(); } catch (e) { /* abaikan */ } if (JSON.stringify(masterOf()) !== before) { adminSynced = true; schedulePush(); } }
          adminSynced = true;
          pill('☁ Tersinkron ' + clock(), 'ok');
        } else {
          // Sheet masih kosong: unggah data awal. Guru selain admin utama mulai dari ruang kerja kosong.
          if (res.tid && res.tid !== 'admin') resetWorkspace();
          else { // admin utama pada server kosong: unggah paket awal (soal, siswa, pengaturan) agar tidak mengunggah bank kosong
            const f0 = createInitialState();
            if (!(state.questions || []).length) state.questions = f0.questions;
            if (!(state.students || []).length) state.students = f0.students;
            if (!(state.testName || '').trim()) state.testName = f0.testName;
          }
          base.master = ''; base.st = {}; base.subs = {}; base.logIds = new Set();
          adminSynced = true;
          schedulePush();
        }
      }

      function schedulePush() {
        if (!adminSynced) return;
        dirty = true;
        dirtySeq++;
        clearTimeout(pushTimer);
        pushTimer = setTimeout(doPush, 1200);
        pill('☁ Menyimpan…', 'busy');
      }

      async function doPush() {
        if (pushing) { pushTimer = setTimeout(doPush, 800); return; }
        pushing = true;
        const seq = dirtySeq;
        try {
          const m = masterOf();
          const mj = JSON.stringify(m);
          const p = { key: adminKey, statusPatches: [], subUpserts: [], subDeletes: [], newLogs: [], clearLogs: false };
          if (mj !== base.master) p.master = m;
          state.students.forEach((s) => {
            if (base.st[s.nis] !== stKey(s)) {
              p.statusPatches.push({ nis: s.nis, status: s.status || 'belum', locked: !!s.locked, violations: Number(s.violations) || 0, violationLogs: s.violationLogs || [] });
            }
          });
          const cur = {};
          state.submissions.forEach((s) => { cur[String(s.nis)] = s; });
          Object.keys(cur).forEach((n) => { if (base.subs[n] !== JSON.stringify(cur[n])) p.subUpserts.push(cur[n]); });
          p.subDeletes = Object.keys(base.subs).filter((n) => !cur[n]);
          const logs = state.antiCheat.logs || [];
          p.newLogs = logs.filter((l) => !base.logIds.has(l.id));
          p.clearLogs = base.logIds.size > 0 && logs.every((l) => !base.logIds.has(l.id));

          if (!p.master && !p.statusPatches.length && !p.subUpserts.length && !p.subDeletes.length && !p.newLogs.length && !p.clearLogs) {
            if (seq === dirtySeq) dirty = false;
            pill('☁ Tersinkron ' + clock(), 'ok');
            return;
          }
          const res = await call('adminPush', p, 30000);
          if (!res.ok) {
            if (isAuthErr(res)) { sessionExpired(); return; }
            throw new Error(res.error || 'Gagal menyimpan');
          }
          if (p.master) base.master = mj;
          p.statusPatches.forEach((x) => { base.st[x.nis] = stKey(x); });
          p.subUpserts.forEach((s) => { base.subs[String(s.nis)] = JSON.stringify(s); });
          p.subDeletes.forEach((n) => { delete base.subs[n]; });
          if (p.clearLogs) base.logIds = new Set();
          p.newLogs.forEach((l) => base.logIds.add(l.id));
          if (seq === dirtySeq) dirty = false;
          pill('☁ Tersimpan ' + clock(), 'ok');
        } catch (e) {
          pill('⚠ Gagal menyimpan ke server — mencoba lagi', 'err');
          pushTimer = setTimeout(doPush, 6000);
        } finally {
          pushing = false;
        }
      }

      function sessionExpired() {
        adminKey = ''; adminSynced = false; window.__cloudUser = null;
        sessionStorage.removeItem('tritas_admin_key');
        sessionStorage.removeItem('tritas_admin_user');
        state.session.role = null;
        origSave();
        renderApp();
        showToast('Sesi admin berakhir. Silakan login ulang.', 'warning');
      }

      function userBusy() {
        const a = document.activeElement;
        if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
        const mb = document.getElementById('modalBackdrop');
        return !!(mb && !mb.classList.contains('hidden'));
      }

      async function adminPoll(force) {
        if (!state || !state.session || state.session.role !== 'admin' || !adminKey || !adminSynced) return;
        if (!force && (dirty || pushing)) return;
        try {
          const res = await call('adminPull', { key: adminKey });
          if (!res.ok) { if (isAuthErr(res)) sessionExpired(); return; }
          if (dirty || pushing) return;
          const sig = JSON.stringify(res.status) + (res.submissions || []).map((s) => s.id + ':' + (s.essayScore || 0) + ':' + Object.keys(s.essayScoresByQ || {}).length).join(',') + ((res.logs || [])[0] || {}).id;
          applyPull(res, false);
          pill('☁ Tersinkron ' + clock(), 'ok');
          if (sig !== lastSig) {
            lastSig = sig;
            if (['siswa', 'keamanan', 'rekap', 'koreksi', 'analitik'].indexOf(state.adminTab) >= 0 && !userBusy()) {

      // ---------- override fungsi bawaan ----------
      const origSave = saveState;
      saveState = function () {

      // ---------- SISWA: log, heartbeat, pelanggaran ----------

      const origAppend = appendAntiCheatLog;
      appendAntiCheatLog = function (entry) {

      async function heartbeat() {
        const ex = state.session && state.session.activeExam;
        if (!ex || state.session.role !== 'student' || hbBusy) return;
        hbBusy = true;
        const stu = state.students.find((s) => String(s.nis).trim() === String(ex.nis).trim());
        const sendLock = !!ex.lockedByAntiCheat && !ex.lockSynced;
        const logs = logQueue.slice();
        try {
          const res = await call('heartbeat', {
            nis: ex.nis, deviceId, violations: ex.violations || 0, answers: ex.answers || {},
            lock: sendLock, logs, violationLogs: ((stu && stu.violationLogs) || []).slice(0, 20)
          }, 12000);
          if (res.kicked) {
            state.session.activeExam = null;
            state.session.role = null;

            renderApp();
            showToast(res.message || 'Sesi ujian berakhir.', 'warning');
            return;
          }
          if (!res.ok) throw new Error(res.error || 'gagal');
          logQueue = logQueue.slice(logs.length);
          let changed = false;
          if (sendLock) { ex.lockSynced = true; changed = true; }
          if (ex.lockedByAntiCheat && ex.lockSynced && res.locked === false) {
            ex.lockedByAntiCheat = false; ex.lockReason = ''; ex.lockSynced = false;

            renderStudentExamView();
            setupExamTimer();

          }

        } finally {
          hbBusy = false;
        }

      const origViolation = handleAntiCheatViolation;

      async function cloudFinalize(isAuto) {
        const ex = state.session.activeExam;

            if (res.ok) {

        openModal('<h3 class="text-lg font-bold text-rose-800">Jawaban belum terkirim</h3><p class="text-sm text-slate-600">Koneksi ke server bermasalah. Jawaban Anda aman di perangkat ini. <strong>Jangan tutup halaman</strong>; sistem mencoba mengirim ulang otomatis.</p>');
        setTimeout(() => { if (state.session.activeExam) cloudFinalize(isAuto); }, 8000);
      }

      // ---------- LOGIN (satu form: admin / siswa) ----------

            renderApp();
            if (res.user && !res.user.sup) guruSegarkanRoster(true);
            showToast(res.user && res.user.mustChange ? 'Selamat datang. Password Anda masih password awal — segera ganti di bagian Akun Guru.' : 'Selamat datang, ' + ((res.user && res.user.name) || 'Admin') + '! Data tersinkron dengan Google Sheets.', res.user && res.user.mustChange ? 'warning' : 'success');
            return;
          }

          const ex = res.exam;
          state.testName = ex.testName;
          state.durationMinutes = ex.durationMinutes;
          state.shuffleQuestions = ex.shuffleQuestions;
          state.shuffleOptions = ex.shuffleOptions;
          state.antiCheat = Object.assign({}, state.antiCheat, ex.antiCheat);
          state.questions = ex.questions;
          state.showScoreToStudent = !!ex.showScore;
          state.showKdToStudent = !!ex.showKd;
          if (ex.appSubtitle) state.appSubtitle = ex.appSubtitle;
          state.students = [{ nis: identifier, name: res.student.name, kelas: res.student.kelas, status: 'sedang_ujian', locked: false, violations: res.violations || 0, violationLogs: [], lastActive: new Date().toLocaleString('id-ID') }];
          state.submissions = [];

          let activeExam = state.session.activeExam;
          const qIds = state.questions.map((q) => q.id);
          if (activeExam && (activeExam.nis !== identifier || JSON.stringify((activeExam.questionOrder || []).slice().sort()) !== JSON.stringify(qIds.slice().sort()))) {
            activeExam = null;
          }
          if (!activeExam) {
            const now = Date.now();
            const order = state.shuffleQuestions ? shuffleArray(qIds, identifier + '_' + now) : qIds;
            const optionMaps = {};
            state.questions.forEach((q) => {
              if (q.type === 'pg' || q.type === 'pg_kompleks') {
                const idx = (q.options || []).map((_, i) => i);
                optionMaps[q.id] = state.shuffleOptions ? shuffleArray(idx, identifier + '_' + q.id) : idx;
              } else if (q.type === 'menjodohkan') {
                const rights = (q.pairs || []).map((p) => p.right);
                optionMaps[q.id] = state.shuffleOptions ? shuffleArray(rights, identifier + '_' + q.id + '_r') : rights;
              }
            });
            activeExam = {
              nis: identifier, studentName: res.student.name, kelas: res.student.kelas,
              startTime: now, endTime: now + res.remainingMs, lastTickEpoch: now, remainingMs: res.remainingMs,
              lockedByAntiCheat: false, lockReason: '', currentIndex: 0,
              questionOrder: order, optionMaps: optionMaps, answers: res.answers || {}, flaggedQuestions: {},
              fontSize: 'md', violations: res.violations || 0,
              lastSavedAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };
          }
          state.session.role = 'student';
          state.session.studentNis = identifier;
          state.session.activeExam = activeExam;
          origSave();
          renderApp();
          showToast('Ujian dimulai untuk ' + res.student.name + ' (' + identifier + '). Jawaban tersimpan otomatis.', 'success');
          heartbeat();
        } catch (err) {
          showToast('Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.', 'danger');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      const origLoginView = renderLoginView;
      renderLoginView = function () {
        // Kembali ke halaman login = sesi admin selesai
        adminKey = ''; adminSynced = false; window.__cloudUser = null;
        sessionStorage.removeItem('tritas_admin_key');
        sessionStorage.removeItem('tritas_admin_user');
        // Jangan menyisakan soal+kunci guru di perangkat bersama
        if (state.session.role !== 'student') { state.questions = []; state.students = []; state.submissions = []; state.antiCheat.logs = []; state.kelasGuru = []; state.autoSoalDraft = createInitialState().autoSoalDraft; window.__rosterAdmin = undefined; window.__rosterErr = ''; window.__bankView = null; window.__bankGuruList = undefined; origSave(); }
        origLoginView();
        const c = document.getElementById('mainContainer');
        // Token tidak boleh tampil di halaman login
        c.querySelectorAll('div').forEach((d) => {
          if (d.children.length === 2 && /^Token Sesi/.test((d.children[0].textContent || '').trim())) d.remove();
        });
        const f = document.getElementById('unifiedLoginForm');
        if (f) {
          const nf = f.cloneNode(true);
          f.replaceWith(nf);
          nf.addEventListener('submit', onLoginSubmit);
        }
        const stat = (ok, text) => {
          const box = document.getElementById('serverStatus'), dot = document.getElementById('serverDot'), tx = document.getElementById('serverStatusText');
          if (!box) return;
          box.className = 'flex items-center gap-2 px-3 py-2 rounded-xl border ' + (ok === true ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : ok === false ? 'border-rose-300 bg-rose-50 text-rose-800' : 'border-amber-300 bg-amber-50 text-amber-800');
          if (dot) dot.className = 'w-2 h-2 rounded-full ' + (ok === true ? 'bg-emerald-500' : ok === false ? 'bg-rose-500' : 'bg-amber-500');
          if (tx) tx.textContent = text;
        };
        const tokenRows = (info) => {
          let a = info.tokens || info.paket || info.pakets;
          if (!a && info.token) a = [{ token: info.token }];
          if (a && !Array.isArray(a) && typeof a === 'object') a = Object.keys(a).map((k) => ({ topik: k, token: (a[k] && typeof a[k] === 'object') ? a[k].token : a[k] }));
          return (Array.isArray(a) ? a : []).filter((x) => x && x.token).map((x) => ({ label: x.topik || x.name || x.label || '', token: String(x.token).toUpperCase() }));
        };
        const ctl = new AbortController();
        const tm = setTimeout(() => ctl.abort(), 12000);
        fetch(CLOUD_URL + '?action=info', { signal: ctl.signal }).then((r) => r.json()).then((info) => {
          clearTimeout(tm);
          if (!info || !info.ready) { stat(null, 'Server tersambung. Belum ada data paket: admin/guru login sekali untuk menyiapkan.'); return; }
          const nm = document.getElementById('loginPaketName'); if (nm && info.testName) nm.textContent = info.testName;
          const set = (label, val) => c.querySelectorAll('div').forEach((d) => {
            if (d.children.length === 2 && d.children[0].textContent.trim() === label) d.children[1].textContent = val;
          });
          set('Alokasi Waktu', Number(info.durationMinutes) + ' Menit');
          set('Total Butir Soal', Number(info.count) + ' Butir');
          const tb = document.getElementById('loginTokenBox');
          if (tb) { const rows = tokenRows(info); tb.innerHTML = rows.length ? loginTokenRowsHtml(rows) : ''; }
          stat(true, 'Terhubung ke server \u2022 data tersinkron otomatis');
        }).catch(() => { clearTimeout(tm); stat(false, 'Server tidak terjangkau. Periksa koneksi internet, lalu muat ulang halaman.'); });
      };

      window.__cloudChangeAdmin = (u, pw) => call('changeAdmin', { key: adminKey, newUser: u, newPass: pw });

      // ---------- start ----------
      window.addEventListener('DOMContentLoaded', () => {
        const role = state && state.session && state.session.role;
        if (role === 'admin') {
          if (!adminKey) {
            state.session.role = null; origSave(); renderApp();
          } else {
            initialAdminPull().then(() => renderApp()).catch(() => { pill('⚠ Gagal memuat dari server', 'err'); });
          }
        } else if (role === 'student' && state.session.activeExam) {
          heartbeat();
        }
        setInterval(heartbeat, 15000);
        setInterval(() => adminPoll(false), 8000);
        document.body.addEventListener('click', (ev) => {
          if (ev.target && ev.target.id === 'cloudPill' && state.session.role === 'admin') adminPoll(true);
        });
      });
    })();
  </script>
</body>
</html>
