    // Helper: Escape HTML to prevent XSS while allowing controlled media/formula tags
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper: Render rich question/option text with safe media & formula markers
    // Supports: [IMG:url], [AUDIO:url], [VIDEO:url], [FORMULA:expr], [CODE:expr]
    function renderRichContent(rawText) {
      if (!rawText) return '';
      let html = escapeHtml(rawText);

      // Convert line breaks
      html = html.replace(/\n/g, '<br/>');

      // [IMG:url]
      html = html.replace(/\[IMG:([^\]]+)\]/gi, function (_, url) {
        const cleanUrl = url.trim();
        const fallback = 'https://placehold.co/600x260/e2e8f0/1e293b?text=Gambar+Soal+Informatika';
        return `<div class="my-3"><img src="${cleanUrl}" alt="Ilustrasi Soal" onerror="this.onerror=null;this.src='${fallback}';" class="max-h-64 w-auto rounded-xl border border-slate-200 shadow-xs object-contain bg-white" /></div>`;
      });

      // [AUDIO:url]
      html = html.replace(/\[AUDIO:([^\]]+)\]/gi, function (_, url) {
        const cleanUrl = url.trim();
        return `<div class="my-3 p-3 rounded-xl bg-slate-100 border border-slate-200"><div class="text-xs font-semibold text-slate-600 mb-1">Audio Soal</div><audio controls class="w-full" src="${cleanUrl}">Browser tidak mendukung audio.</audio></div>`;
      });

      // [VIDEO:url]
      html = html.replace(/\[VIDEO:([^\]]+)\]/gi, function (_, url) {
        const cleanUrl = url.trim();
        return `<div class="my-3 p-3 rounded-xl bg-slate-100 border border-slate-200"><div class="text-xs font-semibold text-slate-600 mb-1">Video Soal</div><video controls class="w-full max-h-64 rounded-lg bg-black" src="${cleanUrl}">Browser tidak mendukung video.</video></div>`;
      });

      // [FORMULA:expr]
      html = html.replace(/\[FORMULA:([^\]]+)\]/gi, function (_, expr) {
        return `<span class="inline-block px-2.5 py-0.5 mx-0.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200 font-mono text-sm font-medium">${expr.trim()}</span>`;
      });

      // [CODE:expr]
      html = html.replace(/\[CODE:([^\]]+)\]/gi, function (_, codeExpr) {
        return `<code class="px-2 py-0.5 mx-0.5 rounded-md bg-slate-900 text-sky-200 font-mono text-xs sm:text-sm">${codeExpr.trim()}</code>`;
      });

      return html;
    }

    // Non-blocking Toast notification
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const styles = {
        info: 'bg-anbk-navy text-white border-anbk-navyDark',
        success: 'bg-emerald-700 text-white border-emerald-800',
        warning: 'bg-amber-600 text-white border-amber-700',
        danger: 'bg-rose-700 text-white border-rose-800'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all ${styles[type] || styles.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span><button type="button" class="text-white/80 hover:text-white font-bold text-base leading-none" aria-label="Tutup">&times;</button>`;

      const closeBtn = toast.querySelector('button');
      closeBtn.addEventListener('click', () => toast.remove());

      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 4000);
    }

    // Modal helper (replaces browser alert/confirm)
    function openModal(htmlContent) {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      if (!backdrop || !card) return;
      card.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      if (!backdrop || !card) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      card.innerHTML = '';
    }

    // Generate dynamic 6-char exam token
    function generateExamToken() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let token = '';
      for (let i = 0; i < 6; i++) {
        token += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return token;
    }

      return String(t || '').replace(/^\[(Formatif|Sumatif)[^\]]*\]\s*/i, '');

    function downloadJsonFile(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

      return m ? m[0] : '';
    }

    function autoSoalCapacity(cfg) {
      const T = getAutoSoalTemplates();
      const els = cfg.elemenId === 'ALL' ? FASE_F_CURRICULUM : FASE_F_CURRICULUM.filter((e) => e.id === cfg.elemenId);
      const cap = {};
      ['pg', 'pg_kompleks', 'pgk_kategori', 'menjodohkan', 'isian', 'esai'].forEach((t) => {
        cap[t] = els.reduce((sum, el) => sum + ((T[el.id] && T[el.id][t]) ? T[el.id][t].length : 0), 0);
      });
      return cap;
    }

    function genAtpPool(cfg) {
      const els = cfg.elemenId === 'ALL' ? FASE_F_CURRICULUM : FASE_F_CURRICULUM.filter((e) => e.id === cfg.elemenId);
      const pool = [];
      els.forEach((el) => el.atpList.forEach((atp) => {
        if (cfg.atpId === 'ALL' || cfg.atpId === atp.id) pool.push({ elemen: el.elemen, elemenId: el.id, ...atp });
      }));
      return pool.length ? pool : [{ elemen: FASE_F_CURRICULUM[0].elemen, elemenId: 'BK_F', ...FASE_F_CURRICULUM[0].atpList[0] }];
    }
    function buildTemplateItem(atpObj, tKey, tpl, cfg, pts, seq) {
      const item = {
        id: 'DRAFT_' + Date.now() + '_' + seq + '_' + Math.floor(Math.random() * 100000),
        type: tKey,
        kd: `${atpObj.kode} • ${atpObj.elemen}`,
        atpKode: atpObj.kode,
        tp: atpObj.tp,
        indikator: atpObj.indikator,
        levelKognitif: cfg.cognitiveLevel,
        points: pts,
        prompt: tpl.prompt,
        pembahasan: tpl.pembahasan || '',
        sumber: 'template'
      };
      if (tKey === 'pg') { item.options = tpl.options.slice(); item.correctIndex = tpl.correctIndex; }
      else if (tKey === 'pg_kompleks') { item.options = tpl.options.slice(); item.correctIndices = tpl.correctIndices.slice(); }
      else if (tKey === 'pgk_kategori') item.statements = tpl.statements.map((x) => ({ ...x }));
      else if (tKey === 'menjodohkan') item.pairs = tpl.pairs.map((p) => ({ ...p }));
      else if (tKey === 'isian') item.answerText = tpl.answerText;
      return item;
    }

    function generateAutoSoalDraft(cfg) {
      const targetElements = cfg.elemenId === 'ALL'
        ? FASE_F_CURRICULUM
        : FASE_F_CURRICULUM.filter((e) => e.id === cfg.elemenId);

      const poolAtps = [];
      targetElements.forEach((el) => {
        el.atpList.forEach((atp) => {
          if (cfg.atpId === 'ALL' || cfg.atpId === atp.id) {
            poolAtps.push({ elemen: el.elemen, elemenId: el.id, ...atp });
          }
        });
      });

      const activePool = poolAtps.length > 0
        ? poolAtps
        : [{ elemen: FASE_F_CURRICULUM[0].elemen, elemenId: 'BK_F', ...FASE_F_CURRICULUM[0].atpList[0] }];

      const templatesByElement = getAutoSoalTemplates();

      const generated = [];
      const typesOrder = ['pg', 'pg_kompleks', 'pgk_kategori', 'menjodohkan', 'isian', 'esai'];
      const shortage = {};
      const usedTpl = new Set();
      let cursor = 0;

      typesOrder.forEach((tKey) => {
        const count = Math.max(0, Number(cfg.counts[tKey] || 0));
        const pts = Math.max(1, Number(cfg.pointsByType[tKey] || 10));

        for (let i = 0; i < count; i++) {
          let atpObj = null;
          let tpl = null;
          for (let attempt = 0; attempt < activePool.length && !tpl; attempt++) {
            const cand = activePool[(cursor + attempt) % activePool.length];
            const elTemplates = templatesByElement[cand.elemenId] || templatesByElement.BK_F;
            const typeList = elTemplates[tKey] || [];
            for (let k = 0; k < typeList.length; k++) {
              const key = cand.elemenId + '|' + tKey + '|' + k;
              if (!usedTpl.has(key)) {
                usedTpl.add(key);
                atpObj = cand;
                tpl = typeList[k];
                break;
              }
            }
            if (tpl) cursor = cursor + attempt + 1;
          }
          if (!tpl) {
            shortage[tKey] = (shortage[tKey] || 0) + 1;
            continue;
          }

          const item = buildTemplateItem(atpObj, tKey, tpl, cfg, pts, generated.length);

          generated.push(item);
        }
      });

      generated.shortage = shortage;
      return generated;
    }

    // v8: KKTP jadi nilai global; jenis asesmen & pengalaman belajar pindah ke level topik (bukan per butir).
    function migrateV8(parsed) {
      try {
        const oldK = parsed && parsed.autoSoalConfig && parsed.autoSoalConfig.kktpThreshold;
        state.kktp = Number(parsed && parsed.kktp) || Number(oldK) || 75;
        if (state.autoSoalConfig) delete state.autoSoalConfig.kktpThreshold;
        if (!state.topikMeta || typeof state.topikMeta !== 'object') state.topikMeta = {};
        const strip = (q) => {
          if (!q || typeof q !== 'object') return;
          if ((q.jenisAsesmen || q.pengalamanBelajar) && typeof topikOf === 'function') {
            const t = topikOf(q);
            if (!state.topikMeta[t]) state.topikMeta[t] = { jenis: q.jenisAsesmen || '', pengalaman: q.pengalamanBelajar || '' };
          }
          delete q.jenisAsesmen; delete q.pengalamanBelajar; delete q.kktpThreshold;
        };
        (state.questions || []).forEach(strip);
        (state.autoSoalDraft || []).forEach(strip);
      } catch (e) { console.error('migrateV8', e); }
    }
    // v9: perbaikan data bawaan yang sudah tersimpan di peramban (hanya menyentuh butir bawaan yang belum diubah guru)
    function migrateV9() {
      try {
        (state.questions || []).forEach((q) => {
          if (!q || typeof q !== 'object') return;
          if (q.type === 'menjodohkan' && Array.isArray(q.pairs)) {
            q.pairs.forEach((p) => { if (p && typeof p.right === 'string' && p.right.indexOf('[FORMULA:^2\\log n]') >= 0) p.right = p.right.replace('[FORMULA:^2\\log n]', '[FORMULA:\\log_2 n]'); });
          }
          if (q.id === 'Q7' && q.type === 'esai' && !String(q.pembahasan || '').trim() && /1\.000\.000 kode buku/.test(String(q.prompt || ''))) {
            q.pembahasan = 'Rubrik (0-20): (1) Sequential Search memeriksa hingga 1.000.000 elemen, O(n) (5); (2) Binary Search membuang separuh data tiap langkah sehingga maksimal sekitar 20 perbandingan, O(log n) (7); (3) langkah pencarian benar: tentukan low/high, hitung mid, bandingkan, geser batas (8).';
          }
        });
      } catch (e) { console.error('migrateV9', e); }
    }
    // v10: bank bawaan lama (Q1-Q7 utuh) diganti 40 soal Pekan Ulangan; bank yang sudah berisi soal lain tidak disentuh
    function migrateV10() {
      try {
        if (state.seedPekanV10) return;
        const qs = state.questions || [];
        const ids = qs.map((q) => q && q.id).join(',');
        if (ids === 'Q1,Q2,Q3,Q4,Q5,Q6,Q7') { state.questions = createInitialState().questions; state.testName = 'Pekan Ulangan Informatika Kelas XI'; state.durationMinutes = 60; }
        state.seedPekanV10 = true;
      } catch (e) { console.error('migrateV10', e); }
    }
    function getKktp() {
      return Math.max(50, Math.min(100, Number(state.kktp) || Number(state.autoSoalConfig && state.autoSoalConfig.kktpThreshold) || 75));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          state = createInitialState();
          saveState();
          return;
        }
        const parsed = JSON.parse(raw);
        const initial = createInitialState();
        const migratingSeed = parsed.studentsSeedVersion !== STUDENT_SEED_VERSION;
        const demoNis = new Set(OLD_DEMO_NIS);
        state = {
          ...initial,
          ...parsed,
          studentsSeedVersion: STUDENT_SEED_VERSION,
          antiCheat: {
            ...initial.antiCheat,
            ...(parsed.antiCheat || {})
          },
          autoSoalConfig: {
          ...initial.autoSoalConfig,
          ...(parsed.autoSoalConfig || {}),
          counts: {
            ...initial.autoSoalConfig.counts,
            ...((parsed.autoSoalConfig && parsed.autoSoalConfig.counts) || {})
          },
          pointsByType: {
            ...initial.autoSoalConfig.pointsByType,
            ...((parsed.autoSoalConfig && parsed.autoSoalConfig.pointsByType) || {})
          }
        },
        autoSoalDraft: Array.isArray(parsed.autoSoalDraft) ? parsed.autoSoalDraft : initial.autoSoalDraft,
        students: (() => {
          if (!Array.isArray(parsed.students)) return initial.students;
          const saved = parsed.students.map((x) => ({ locked: false, violations: 0, violationLogs: [], ...x }));
          if (!migratingSeed) return saved; // data sudah mengikuti Excel; hapus/ubah manual tetap dihormati
          // Migrasi satu kali: ganti data contoh dengan data Excel, pertahankan progres NIS yang sama dan siswa tambahan manual.
          const byNis = new Map(saved.map((x) => [String(x.nis || '').trim(), x]));
          const seedSet = new Set(initial.students.map((x) => x.nis));
          const merged = initial.students.map((seed) => byNis.has(seed.nis)
            ? { ...byNis.get(seed.nis), name: seed.name, kelas: seed.kelas }
            : seed);
          saved.forEach((x) => {
            const k = String(x.nis || '').trim();
            if (k && !seedSet.has(k) && !demoNis.has(k)) merged.push(x);
          });
          return merged;
        })(),
        submissions: migratingSeed
          ? (Array.isArray(parsed.submissions) ? parsed.submissions : []).filter((sub) => !demoNis.has(String(sub.nis || '').trim()))
          : (Array.isArray(parsed.submissions) ? parsed.submissions : initial.submissions),
          session: (migratingSeed && parsed.session && demoNis.has(String(parsed.session.studentNis || '').trim()))
            ? { ...initial.session }
            : {
              ...initial.session,
              ...(parsed.session || {})
            }
        };
        if (!Array.isArray(state.guruLocal)) state.guruLocal = [];
        migrateV8(parsed);
        migrateV9();
        migrateV10();
        if (migratingSeed) saveState();
      } catch (err) {
        console.error('Gagal memuat state dari localStorage:', err);
        let recovered = null;
        try { recovered = JSON.parse(localStorage.getItem(STORAGE_KEY + '_auto') || 'null'); } catch (e2) { recovered = null; }
        if (recovered && typeof recovered === 'object') {
          state = { ...createInitialState(), ...recovered, guruLocal: Array.isArray(recovered.guruLocal) ? recovered.guruLocal : [] };
          setTimeout(() => { try { showToast('Data utama rusak; dipulihkan dari salinan otomatis terakhir.', 'warning'); } catch (e3) { /* abaikan */ } }, 500);
        } else {
          state = createInitialState();
        }
      }
    }

    function saveState() {
      try {
        if (!state) return;
        if (!CLOUD_URL && state.session && state.session.role === 'admin' && Array.isArray(state.questions)) {
          const me = state.session.guruNip || 'admin';
          state.questions.forEach((q) => { if (q && !q.owner) q.owner = me; });
        }
        const json = JSON.stringify(state);
        try {
          localStorage.setItem(STORAGE_KEY, json);
        } catch (qErr) {
          localStorage.removeItem(STORAGE_KEY + '_auto'); // lepaskan ruang salinan, coba sekali lagi
          localStorage.setItem(STORAGE_KEY, json);
        }
        const nowT = Date.now();
        if (!window.__lastSnap || nowT - window.__lastSnap > 120000) {
          window.__lastSnap = nowT;
          try { localStorage.setItem(STORAGE_KEY + '_auto', json); } catch (sErr) { try { localStorage.removeItem(STORAGE_KEY + '_auto'); } catch (e4) { /* abaikan */ } }
        }
      } catch (err) {
        console.error('Gagal menyimpan state ke localStorage:', err);
        showToast('Peringatan: Penyimpanan lokal penuh atau diblokir. Unduh cadangan JSON sekarang.', 'warning');
      }
    }

    // Synchronize state changes across tabs/windows and keep active sessions consistent
    function syncStateFromStorage() {
      if (!state) {
        loadState();
        return;
      }
      const prevRole = state.session ? state.session.role : null;
      const prevTab = state.adminTab;
      const prevLocked = Boolean(state.session && state.session.activeExam && state.session.activeExam.lockedByAntiCheat);
      const prevExamExists = Boolean(state.session && state.session.activeExam);

      loadState();

      const nextRole = state.session ? state.session.role : null;
      const nextLocked = Boolean(state.session && state.session.activeExam && state.session.activeExam.lockedByAntiCheat);
      const nextExamExists = Boolean(state.session && state.session.activeExam);

      // Preserve current admin view tab when another tab updates shared exam/student/submission data
      if (prevRole === 'admin' && nextRole === 'admin' && prevTab) {
        state.adminTab = prevTab;
      }

      if (prevRole !== nextRole || prevLocked !== nextLocked || prevExamExists !== nextExamExists) {
        renderApp();
        setupTokenRotation();
      } else if (nextRole === 'admin') {
        renderHeader();
        renderAdminView();
      } else if (nextRole === 'student' && nextExamExists) {
        renderHeader();
        renderStudentExamView();
        setupExamTimer();
      }
    }

    function shuffleArray(arr, seedStr) {
      const copy = arr.slice();
      let seed = 0;
      for (let i = 0; i < seedStr.length; i++) {
        seed = ((seed << 5) - seed) + seedStr.charCodeAt(i);
        seed |= 0;
      }
      function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return Math.abs(seed) / 4294967296;
      }
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function evaluateSubmission(answersMap) {
      let autoScore = 0;
      let maxAutoScore = 0;
      let maxEssayScore = 0;
      const itemResults = {};

      state.questions.forEach((q) => {
        const pts = Number(q.points) || 10;
        const ans = answersMap ? answersMap[q.id] : undefined;

        if (q.type === 'esai') {
          maxEssayScore += pts;
          itemResults[q.id] = {
            type: 'esai',
            maxPoints: pts,
            awarded: 0,
            isCorrect: null,
            pendingManual: true
          };
          return;
        }

        maxAutoScore += pts;
        let isCorrect = false;
        let partialRatio = 0;

        if (q.type === 'pg') {
          isCorrect = Number(ans) === Number(q.correctIndex);
        } else if (q.type === 'pg_kompleks') {
          const expected = (q.correctIndices || []).slice().map(Number).sort((a, b) => a - b);
          const actual = Array.isArray(ans) ? ans.slice().map(Number).sort((a, b) => a - b) : [];
          isCorrect = expected.length === actual.length && expected.every((v, idx) => v === actual[idx]);
        } else if (q.type === 'pgk_kategori') {
          const stmts = q.statements || [];
          isCorrect = stmts.length > 0 && Array.isArray(ans) && stmts.every((st, idx) => ans[idx] === st.answer);
          if (stmts.length > 0 && Array.isArray(ans)) partialRatio = stmts.filter((st, idx) => ans[idx] === st.answer).length / stmts.length;
        } else if (q.type === 'menjodohkan') {
          const pairs = q.pairs || [];
          isCorrect = pairs.length > 0 && ans && typeof ans === 'object' && pairs.every((p, idx) => ans[idx] === p.right);
          if (pairs.length > 0 && ans && typeof ans === 'object') partialRatio = pairs.filter((p, idx) => ans[idx] === p.right).length / pairs.length;
        } else if (q.type === 'isian') {
          // Normalisasi: abaikan huruf besar/kecil, spasi ganda, titik/koma desimal; kunci alternatif dipisah | atau ;
          const normIsian = (v) => String(v == null ? '' : v).normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ').replace(/(\d),(\d)/g, '$1.$2');
          const keys = String(q.answerText || '').split(/[|;]/).map(normIsian).filter((k) => k.length > 0);
          const actualNorm = normIsian(ans);
          isCorrect = keys.length > 0 && actualNorm.length > 0 && keys.includes(actualNorm);
        }

        const awarded = isCorrect ? pts : (state.partialScoring ? Math.round(pts * partialRatio * 100) / 100 : 0);
        autoScore += awarded;
        itemResults[q.id] = {
          type: q.type,
          maxPoints: pts,
          awarded: awarded,
          isCorrect: isCorrect,
          pendingManual: false
        };
      });

      return {
        autoScore,
        maxAutoScore,
        maxEssayScore,
        maxTotalScore: maxAutoScore + maxEssayScore,
        itemResults
      };
    }

    // ---- Helper koreksi esai ----
    function getEssayQuestions() {
      return (state.questions || []).filter((q) => q.type === 'esai');
    }
    function isEssayGraded(sub, eqId) {
      return Boolean(sub && sub.essayScoresByQ && sub.essayScoresByQ[eqId] !== undefined);
    }
    function countPendingEssay() {
      const eqs = getEssayQuestions();
      let n = 0;
      (state.submissions || []).forEach((sub) => eqs.forEach((eq) => { if (!isEssayGraded(sub, eq.id)) n++; }));
      return n;
    }

    function computeFinalScore(submission) {
      const auto = Number(submission.autoScore || 0);
      const essay = Number(submission.essayScore || 0);
      const maxTotal = Math.max(1, Number(submission.maxTotalScore || 100));
      const total = auto + essay;
      const percent = Math.round((total / maxTotal) * 100);
      return { total, percent };
    }

    function hasValidAnswer(qId, ans) {
      if (ans === undefined || ans === null) return false;
      if (typeof ans === 'string') return ans.trim().length > 0;
      if (typeof ans === 'number') return !isNaN(ans);
      if (Array.isArray(ans)) return ans.some((v) => v !== undefined && v !== null && String(v).trim() !== '');
      if (typeof ans === 'object') return Object.values(ans).some((v) => v !== undefined && v !== null && String(v).trim() !== '');
      return false;
    }

    function finalizeExamSubmission(isAutoSubmit = false) {
      const exam = state.session.activeExam;
      if (!exam) return;

      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      const evalData = evaluateSubmission(exam.answers || {}, exam.topik || '');
      const submittedAt = new Date().toLocaleString('id-ID');

      const submissionRecord = {
        id: 'SUB_' + Date.now(),
        nis: exam.nis,
        studentName: exam.studentName,
        kelas: exam.kelas,
        testName: state.testName,
        submittedAt: submittedAt,
        topik: exam.topik || '',
        mode: exam.mode || 'ujian',
        isAutoSubmit: Boolean(isAutoSubmit),
        violations: Number(exam.violations || 0),

    const GURU_DEFAULT_PW = 'gurutritas'; // password awal semua guru (sama dengan default server)
    function genGuruPassword() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const buf = new Uint32Array(8);
      (window.crypto || window.msCrypto).getRandomValues(buf);
      return Array.from(buf).map((v) => chars[v % chars.length]).join('');
    }
    function currentLocalGuru() {
      const n = state.session && state.session.guruNip;

    }
    // Format: [No] NIP <tab|;> Nama [<tab|;> Password]. Dengan pemisah koma hanya NIP + Nama (nama boleh memuat koma gelar).
    function parseGuruRowsPw(text) {
      const rows = [];
      String(text || '').split(/\r?\n/).forEach((line) => {
        if (!line.trim()) return;
        const delim = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf(';') >= 0 ? ';' : ',');
        let cells = line.split(delim).map((c) => c.replace(/^["'\s]+|["'\s]+$/g, ''));
        if (cells.some((c) => /^(nip|username)$/i.test(c))) return;
        if (cells.length >= 3 && /^\d{1,4}$/.test(cells[0]) && /^\d{4,}$/.test(cells[1])) cells = cells.slice(1);
        if (cells.length < 2) return;
        if (delim === ',') rows.push({ nip: cells[0], name: cells.slice(1).join(', ').trim(), password: '' });
        else rows.push({ nip: cells[0], name: cells[1], password: cells[2] || '' });
      });
      return rows;
    }
    function getStudentPassword(st) {
      const pw = st && st.password !== undefined && st.password !== null ? String(st.password).trim() : '';
      return pw || String((st && st.nis) || '').trim();

    function isGuruRole() {
      if (state.session && state.session.guruNip) return true;

    function kelasKey(v) { return String(v === undefined || v === null ? '' : v).trim(); }
    function guruKelasPilihan() {

    // Daftar kelas yang disediakan admin: [{kelas, count}]
    function adminKelasOptions() {
      const src = (CLOUD_URL && isGuruRole()) ? (Array.isArray(window.__rosterAdmin) ? window.__rosterAdmin : []) : (state.students || []);
      const m = new Map();
      src.forEach((x) => { const k = kelasKey(x.kelas); if (k) m.set(k, (m.get(k) || 0) + 1); });
      return Array.from(m, ([kelas, count]) => ({ kelas, count })).sort((a, b) => a.kelas.localeCompare(b.kelas, 'id', { numeric: true }));
    }
    // Mode server: ambil roster admin (aksi server "rosterGet", hanya-baca).
    async function guruMuatRosterAdmin() {
      if (!CLOUD_URL || !window.__cloudGuru) return { ok: true };
      window.__rosterLoading = true;
      try {
        const r = await window.__cloudGuru('rosterGet');
        if (r && r.ok && Array.isArray(r.students)) {
          window.__rosterAdmin = r.students.map((x) => ({ nis: kelasKey(x.nis), name: kelasKey(x.name), kelas: kelasKey(x.kelas), password: kelasKey(x.password) })).filter((x) => x.nis && x.name && x.kelas);
          window.__rosterErr = '';
          return { ok: true };
        }
        window.__rosterErr = (r && r.error) || 'Server tidak merespons.';
      } catch (e) { window.__rosterErr = 'Server tidak terjangkau.'; }
      finally { window.__rosterLoading = false; }
      if (!Array.isArray(window.__rosterAdmin)) window.__rosterAdmin = [];
      return { ok: false, error: window.__rosterErr };
    }
    // Terapkan pilihan kelas guru. Mode server: salin siswa kelas terpilih dari roster admin ke ruang kerja guru.
    // Mode lokal: hanya memfilter tampilan (data peserta tetap milik admin).
    function terapkanKelasGuru(selected, silent) {
      const avail = new Set(adminKelasOptions().map((o) => o.kelas));
      const pilih = Array.from(new Set((selected || []).map(kelasKey).filter((k) => k && (avail.has(k) || !avail.size)))).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
      if (CLOUD_URL && !(state.session && state.session.guruNip)) {
        const src = Array.isArray(window.__rosterAdmin) ? window.__rosterAdmin : [];
        const want = new Set(pilih);
        const old = new Map((state.students || []).map((x) => [String(x.nis).trim(), x]));
        const next = [];
        src.forEach((r) => {
          if (!want.has(r.kelas)) return;
          const o = old.get(r.nis);
          next.push(o
            ? Object.assign({}, o, { name: r.name, kelas: r.kelas, password: r.password })
            : { nis: r.nis, name: r.name, kelas: r.kelas, password: r.password, status: 'belum', locked: false, violations: 0, violationLogs: [], lastActive: null });
        });
        const keep = new Set(next.map((x) => String(x.nis).trim()));
        const dropped = (state.students || []).filter((x) => !keep.has(String(x.nis).trim()));
        const droppedWithSub = dropped.filter((x) => (state.submissions || []).some((sb) => String(sb.nis).trim() === String(x.nis).trim()));
        if (droppedWithSub.length && !silent && !confirm(droppedWithSub.length + ' siswa yang kelasnya tidak dipilih lagi sudah punya nilai. Nilai mereka ikut dihapus dari ruang kerja Anda. Lanjutkan?')) return false;
        state.students = next;
        state.submissions = (state.submissions || []).filter((sb) => keep.has(String(sb.nis).trim()));
        state.siswaClassFilter = 'ALL';
        state.siswaSearchQuery = '';

      setGuruKelasPilihan(pilih);
      saveState();
      if (state.adminTab === 'siswa') renderAdminView();
      if (!silent) showToast(pilih.length ? 'Kelas peserta diperbarui: ' + pilih.join(', ') + '.' : 'Tidak ada kelas dipilih.', pilih.length ? 'success' : 'warning');
      return true;
    }
    // ===== Topik & kepemilikan bank soal =====
    function topikOf(q) {
      const t = q && q.topik ? String(q.topik).replace(/\s+/g, ' ').trim() : '';
      if (t) return t;
      const kode = q && q.atpKode;
      if (kode && typeof FASE_F_CURRICULUM !== 'undefined') {
        const el = FASE_F_CURRICULUM.find((e) => (e.atpList || []).some((a) => a.kode === kode));
        if (el && el.elemen) return el.elemen;
      }
      const kd = q && q.kd ? String(q.kd) : '';
      if (kd.indexOf('\u2022') >= 0) { const x = kd.split('\u2022').slice(1).join('\u2022').trim(); if (x) return x; }
      return 'Tanpa Topik';
    }
    // v9: nama topik dibakukan (spasi dirapikan, huruf besar/kecil mengikuti topik yang sudah ada) agar "Mesin Pencari" dan "mesin pencari" tidak menjadi dua paket ujian
    function canonTopik(name) {
      const clean = String(name || '').replace(/\s+/g, ' ').trim();
      if (!clean) return '';
      const low = clean.toLowerCase();
      const pool = (state.questions || []).concat(state.autoSoalDraft || []);
      for (let i = 0; i < pool.length; i++) {
        const q = pool[i];
        if (q && q.topik) { const e = String(q.topik).replace(/\s+/g, ' ').trim(); if (e.toLowerCase() === low) return e; }
      }
      const cfg = state.topikConfig || {};
      const k = Object.keys(cfg).find((n) => n.toLowerCase() === low);
      return k || clean;
    }
    function topikInUse(name) {
      if (!name) return false;
      const c = state.topikConfig && state.topikConfig[name];

      function setLoginTab(t) {
        const guru = t === 'guru';
        document.querySelectorAll('.login-tab').forEach((b) => {
          const on = b.getAttribute('data-login-tab') === t;
          b.setAttribute('aria-selected', on ? 'true' : 'false');
          b.className = 'login-tab px-3 py-2 rounded-lg text-xs font-bold transition cursor-pointer ' + (on ? 'bg-white shadow-sm text-anbk-blue' : 'text-slate-500 hover:text-slate-700');
        });
        const tr = document.getElementById('loginTokenRow'), ti = document.getElementById('unifiedTokenInput'), ui = document.getElementById('unifiedUserInput');
        if (tr) tr.classList.toggle('hidden', guru);
        if (ti) { ti.required = false; if (guru) ti.value = ''; }
        const gh = document.getElementById('loginGuruHint'); if (gh) gh.classList.toggle('hidden', !guru);
        const lf = document.getElementById('unifiedLoginForm'); if (lf) lf.dataset.tab = t;
        const lb = document.getElementById('lblLoginUser'); if (lb) lb.textContent = guru ? 'NIP Guru (atau username admin)' : 'NIS Siswa';
        const sl = document.getElementById('loginSubmitLabel'); if (sl) sl.textContent = guru ? 'Masuk sebagai Guru' : 'Masuk Ujian';
        if (ui) ui.placeholder = guru ? 'Masukkan NIP' : 'Contoh: 252610158';
      }
      document.querySelectorAll('.login-tab').forEach((b) => b.addEventListener('click', () => { setLoginTab(b.getAttribute('data-login-tab')); const u = document.getElementById('unifiedUserInput'); if (u) u.focus(); }));
      setLoginTab('siswa');
      const srvBtn = document.getElementById('btnServerCfg');
      if (srvBtn) {
        srvBtn.addEventListener('click', () => {
          const box = document.getElementById('serverCfgBox');
          if (CLOUD_URL) { box.classList.toggle('hidden'); return; }
          let bk = '';
          try { bk = (localStorage.getItem('tritas_cloud_url_backup') || '').trim(); } catch (e) { /* abaikan */ }
          if (bk) { try { localStorage.setItem('tritas_cloud_url', bk); } catch (e) { showToast('Browser menolak penyimpanan.', 'danger'); return; } location.reload(); return; }
          box.classList.remove('hidden');
          const inp = document.getElementById('srvUrlInput'); if (inp) inp.focus();
        });
        const lokalBtn = document.getElementById('btnModeLokal');
        if (lokalBtn) lokalBtn.addEventListener('click', () => {
          if (!CLOUD_URL) { showToast('Aplikasi sudah berjalan di mode lokal.', 'warning'); return; }
          if (CLOUD_URL_DEFAULT) { showToast('URL server tertanam di file ini (CLOUD_URL_DEFAULT). Kosongkan di kode untuk memakai mode lokal.', 'warning'); return; }
          try { localStorage.setItem('tritas_cloud_url_backup', CLOUD_URL); localStorage.removeItem('tritas_cloud_url'); } catch (e) { /* abaikan */ }
          location.reload();
        });
        document.getElementById('btnSrvSave').addEventListener('click', () => {
          const u = document.getElementById('srvUrlInput').value.trim();
          if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { showToast('URL harus berupa alamat Web app Apps Script yang berakhiran /exec.', 'warning'); return; }
          try { localStorage.setItem('tritas_cloud_url', u); } catch (e) { showToast('Browser menolak penyimpanan.', 'danger'); return; }
          location.reload();
        });
        document.getElementById('btnSrvClear').addEventListener('click', () => { try { if (CLOUD_URL && !CLOUD_URL_DEFAULT) localStorage.setItem('tritas_cloud_url_backup', CLOUD_URL); localStorage.removeItem('tritas_cloud_url'); } catch (e) { /* abaikan */ } location.reload(); });
      }

      const unifiedForm = document.getElementById('unifiedLoginForm');
      if (unifiedForm) {
        unifiedForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const identifier = document.getElementById('unifiedUserInput').value.trim();
          const pass = document.getElementById('unifiedPassInput').value.trim();
          const token = document.getElementById('unifiedTokenInput').value.trim().toUpperCase();

          // 1. Check Admin credentials first
          if (identifier === (state.adminUser || 'admin-tritas') && pass === (state.adminPass || 'tritasjaya')) {
            localStampLegacyOwners();
            state.session.role = 'admin';
            state.session.studentNis = null;
            state.session.guruNip = null;
            if (!(state.guruLocal || []).length && !state.guruHintShown) { state.adminTab = 'guru'; state.guruHintShown = true; }
            saveState();
            renderApp();
            showToast('Selamat datang, Admin Tritas Test!', 'success');
            return;
          }

          // 1b. Akun guru buatan admin (mode lokal): username = NIP
          if (!CLOUD_URL) {
            const idN = identifier.replace(/\s+/g, '');
            const gu = (state.guruLocal || []).find((x) => String(x.nip).replace(/\s+/g, '') === idN);
            if (gu && !gu.password) {
              showToast('Akun guru ini dikelola server dan belum punya password lokal. Minta admin membuat/reset password di Data Guru.', 'warning');
              return;
            }
            if (gu && pass !== gu.password) {
              showToast('Password guru salah. Jika belum pernah menggantinya, tanyakan password awal ke admin.', 'danger');
              return;
            }
            if (gu && gu.password && pass === gu.password) {
              localStampLegacyOwners();
              state.session.role = 'admin';
              state.session.studentNis = null;
              state.session.guruNip = gu.nip;
              if (state.adminTab === 'guru') state.adminTab = 'pengaturan';
              saveState();
              renderApp();
              showToast(gu.mustChange ? 'Selamat datang, ' + gu.name + '. Password Anda dibuat admin — segera ganti di Pengaturan Ujian → Akun.' : 'Selamat datang, ' + gu.name + '.', gu.mustChange ? 'warning' : 'success');
              return;
            }
          }

          // 2. Otherwise validate as Student (NIS + Password + Token)
          const student = state.students.find((s) => String(s.nis).trim() === identifier);
          if (!student) {
            showToast('Akun tidak ditemukan di perangkat ini. Siswa: periksa NIS. Guru: akun harus dibuat admin di browser yang sama (atau gunakan mode server).', 'danger');
            return;
          }
          if (pass !== getStudentPassword(student)) {
            showToast('Kata sandi salah. Periksa kembali atau minta password ke guru/pengawas.', 'danger');
            return;
          }
          if (!token) {
            showToast('Token ujian wajib diisi untuk masuk ke sesi ujian siswa.', 'warning');
            return;
          }
          const tpRes = resolveTokenTopic(token);
          if (!tpRes.ok) { showToast(tpRes.msg, 'danger'); return; }
          const loginTopik = tpRes.topik;
          { const w = examWindowMessage(student.kelas); if (w) { showToast(w, 'warning'); return; } }
          if ((state.submissions || []).some((sb) => String(sb.nis).trim() === identifier && String(sb.topik || '') === String(loginTopik || ''))) {
            showToast('Anda sudah menyelesaikan ujian ini. Hubungi admin untuk reset jika diperlukan.', 'warning');
            return;
          }
          if (student.locked) {
            showToast('Akun ujian Anda terkunci oleh sistem anti-curang. Hubungi pengawas/admin.', 'danger');
            return;
          }

          let activeExam = state.session.activeExam;
          if (activeExam && activeExam.nis === identifier && String(activeExam.topik || '') !== String(loginTopik || '')) {
            showToast('Anda sedang mengerjakan ujian topik lain' + (activeExam.topik ? ' (' + activeExam.topik + ')' : '') + '. Selesaikan dahulu.', 'warning');
            return;
          }
          if (!activeExam || activeExam.nis !== identifier) {
            if (student.status === 'sedang_ujian') {
              showToast('Status akun sedang aktif di sesi lain. Minta Admin melakukan Reset Login jika perangkat hang.', 'warning');
              return;
            }

            const now = Date.now();
            const durationMs = (topikModeOf(loginTopik) === 'latihan' ? 24 * 60 : topikDurationMinutes(loginTopik)) * 60 * 1000;
            const qIds = questionsForTopik(loginTopik).map((q) => q.id);
            const questionOrder = state.shuffleQuestions ? shuffleArray(qIds, identifier + '_' + now) : qIds;

            const optionMaps = {};
            state.questions.forEach((q) => {
              if (q.type === 'pg' || q.type === 'pg_kompleks') {
                const indices = (q.options || []).map((_, idx) => idx);
                optionMaps[q.id] = state.shuffleOptions ? shuffleArray(indices, identifier + '_' + q.id) : indices;
              } else if (q.type === 'menjodohkan') {
                const rights = (q.pairs || []).map((p) => p.right);
                optionMaps[q.id] = state.shuffleOptions ? shuffleArray(rights, identifier + '_' + q.id + '_r') : rights;
              }
            });

            activeExam = {
              nis: identifier,
              studentName: student.name,
              topik: loginTopik || '',
              mode: topikModeOf(loginTopik),
              kelas: student.kelas,
              startTime: now,
              endTime: now + durationMs,
              lastTickEpoch: now,
              remainingMs: durationMs,
              lockedByAntiCheat: false,
              lockReason: '',
              currentIndex: 0,
              questionOrder: questionOrder,
              optionMaps: optionMaps,
              answers: {},
              flaggedQuestions: {},
              fontSize: 'md',
              violations: student.violations || 0,
              lastSavedAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };
          }

          student.status = 'sedang_ujian';
          student.lastActive = new Date().toLocaleString('id-ID');
          state.session.role = 'student';
          state.session.studentNis = identifier;
          state.session.activeExam = activeExam;
          saveState();
          renderApp();
          showToast(`Ujian dimulai untuk ${student.name} (${student.nis}). Jawaban tersimpan otomatis.`, 'success');
        });
      }
    }

    // =========================================================================

      const totalPts = state.questions.reduce((acc, q) => acc + (Number(q.points) || 0), 0);

        { id: 'siswa', group: 'Persiapan', step: '03', label: 'Data Peserta', desc: isGuruRole() ? (guruKelasPilihan().length ? `${guruKelasPilihan().length} kelas dipilih • ${state.students.length} siswa` : 'Pilih kelas peserta') : `${state.students.length} siswa aktif` },
        { id: 'koreksi', group: 'Setelah Ujian', step: '04', label: 'Koreksi Esai', desc: essayQCount === 0 ? 'Tidak ada soal esai' : (pendingEssay > 0 ? `${pendingEssay} jawaban belum dinilai` : 'Semua esai sudah dinilai'), pending: pendingEssay > 0 },
        { id: 'rekap', group: 'Setelah Ujian', step: '05', label: 'Rekap Nilai', desc: `${state.students.length} siswa • ${state.submissions.length} terkumpul` },
        { id: 'analitik', group: 'Setelah Ujian', step: '06', label: 'Analitik Butir', desc: 'Daya serap & kesukaran' }
      ];

          <!-- Top Compact Status & KPI Bar -->

                ADM
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-[11px] font-bold uppercase tracking-wider text-anbk-blue">Konsol Pengawas &amp; Guru</span>

    function parseGuruRows(text) {
      const rows = [];
      String(text || '').split(/\r?\n/).forEach((line) => {
        if (!line.trim()) return;
        const delim = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf(';') >= 0 ? ';' : ',');
        let cells = line.split(delim).map((c) => c.replace(/^["'\s]+|["'\s]+$/g, ''));
        if (cells.some((c) => /^nip$/i.test(c))) return; // baris judul (No / NIP / Nama)
        if (cells.length >= 3 && /^\d{1,4}$/.test(cells[0])) cells = cells.slice(1); // buang kolom No
        if (cells.length < 2) return;
        rows.push({ nip: cells[0], name: cells.slice(1).join(' ').trim() });
      });
      return rows;
    }

      document.getElementById('btnGuruSync').addEventListener('click', async () => {

          pushed = r.added || 0; skippedN = (r.skipped || []).length;
        }
        let pulled = 0;
        list.forEach((g) => {
          const l = local.find((x) => x.nip === g.nip);
          if (!l) { local.push({ nip: g.nip, name: g.name, password: '', mustChange: !!g.mustChange, server: true }); pulled++; }

          document.getElementById('gImportText').value = text;

      document.getElementById('btnSaveConfig').addEventListener('click', () => {
        const v = (id) => document.getElementById(id).value;
        const tName = v('cfgTestName').trim();
        const dur = parseInt(v('cfgDuration'), 10);
        const exStart = v('cfgExamStart');
        const exEnd = v('cfgExamEnd');
        if (!tName) { showToast('Nama tes tidak boleh kosong.', 'warning'); return; }
        if (!dur || dur < 1) { showToast('Durasi minimal 1 menit.', 'warning'); return; }
        if (exStart && exEnd && exEnd <= exStart) { showToast('Semua kelas: waktu ditutup harus setelah waktu dibuka.', 'warning'); return; }
        const clsSch = {};
        let clsErr = '';
        document.querySelectorAll('[data-cls-start]').forEach((el) => {
          const k = el.getAttribute('data-cls-start');
          const st = el.value || '';
          const en = (Array.from(document.querySelectorAll('[data-cls-end]')).find((x) => x.getAttribute('data-cls-end') === k) || {}).value || '';
          if (st && en && en <= st) clsErr = 'Kelas ' + k + ': waktu ditutup harus setelah waktu dibuka.';
          if (st || en) clsSch[k] = { start: st, end: en };
        });
        if (clsErr) { showToast(clsErr, 'warning'); return; }

        state.schoolName = v('cfgSchool').trim();
        state.academicYear = v('cfgYear').trim();
        state.subject = v('cfgSubject').trim();
        state.levelLabel = v('cfgLevel').trim();
        state.assessmentType = v('cfgAsType');

        state.examStart = exStart;
        state.examEnd = exEnd;

      }));

        delete cp.session;
        if (isGuruRole()) { delete cp.guruLocal; delete cp.adminPass; delete cp.adminUser; }
        downloadJsonFile('cadangan_' + new Date().toISOString().slice(0, 10) + '.json', cp);

      document.getElementById('btnRestoreBackup').addEventListener('click', () => document.getElementById('fileRestoreBackup').click());
      document.getElementById('fileRestoreBackup').addEventListener('change', async (ev) => {
        const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f) return;
        try {
          const data = JSON.parse(await f.text());
          if (!data || typeof data !== 'object' || !Array.isArray(data.questions) || !Array.isArray(data.students)) throw new Error('format');
          if (!confirm('Pulihkan dari "' + f.name + '"? Data sekarang (' + state.questions.length + ' soal, ' + state.students.length + ' siswa, ' + state.submissions.length + ' hasil) akan DIGANTI.')) return;
          const keep = state.session;
          const keepG = state.guruLocal, keepU = state.adminUser, keepP = state.adminPass;
          state = { ...createInitialState(), ...data, session: keep };
          if (!Array.isArray(data.guruLocal)) state.guruLocal = Array.isArray(keepG) ? keepG : [];
          if (!data.adminPass) { state.adminUser = keepU; state.adminPass = keepP; }
          saveState(); renderApp();
          showToast('Data dipulihkan dari cadangan.', 'success');
        } catch (e) { showToast('Berkas bukan cadangan Tritas Test yang valid.', 'danger'); }
      });

        if (u.length < 4) { showToast('Username minimal 4 karakter.', 'warning'); return; }
        if (pw.length < 8) { showToast('Password minimal 8 karakter.', 'warning'); return; }
        if (pw !== pw2) { showToast('Konfirmasi password tidak sama.', 'warning'); return; }
        if (window.__cloudChangeAdmin) {
          try {
            const res = await window.__cloudChangeAdmin(u, pw);
            if (!res || !res.ok) { showToast((res && res.error) || 'Gagal mengubah akun admin.', 'danger'); return; }
          } catch (e) { showToast('Tidak dapat terhubung ke server.', 'danger'); return; }
        } else if (state.session.guruNip) {
          const me = currentLocalGuru();
          if (!me) { showToast('Akun guru tidak ditemukan. Hubungi admin.', 'danger'); return; }
          me.password = pw; me.mustChange = false;
          saveState();
        } else {
          state.adminUser = u;
          state.adminPass = pw;
          saveState();
        }
        if (window.__cloudUser) { window.__cloudUser.mustChange = false; try { sessionStorage.setItem('tritas_admin_user', JSON.stringify(window.__cloudUser)); } catch (e) { /* abaikan */ } }
        showToast('Akun diperbarui. Gunakan password baru saat login berikutnya.', 'success');
        renderAdminView();
      });
    }

      // ===== Upload gambar -> SVG =====
      window.__imgStore = window.__imgStore || {};

      const IMG_MAX_BYTES = 150 * 1024;
      function imgNextId() {
        let n = 1; while (imgStore['g' + n]) n++; return 'g' + n;
      }
      function imgCollapse(text) { // data URI panjang -> penanda pendek agar kolom soal tetap rapi
        return String(text || '').replace(/\[IMG:(data:image\/svg\+xml[^\]]+)\]/g, (_, uri) => {
          let id = Object.keys(imgStore).find((k) => imgStore[k] === uri);

      function imgExpand(text) {

        const h = new Array(256).fill(0); for (let i = 0; i < g.length; i++) h[g[i]]++;

        for (let t = 0; t < 256; t++) {
          wB += h[t]; if (!wB) continue; const wF = tot - wB; if (!wF) break;

          const v = wB * wF * (mB - mF) * (mB - mF); if (v > best) { best = v; thr = t; }
        }
        return thr;
      }
      function imgTrace(dark, w, h) { // piksel gelap -> path persegi (run horizontal digabung vertikal)
        let open = new Map(), d = '';
        const emit = (key, y) => { const [x0, x1, y0] = key.split(',').map(Number); d += 'M' + x0 + ' ' + y0 + 'h' + (x1 - x0) + 'v' + (y - y0) + 'h-' + (x1 - x0) + 'z'; };
        for (let y = 0; y <= h; y++) {
          const now = new Set();
          if (y < h) {
            let x = 0; const row = y * w;
            while (x < w) {
              if (dark[row + x]) { const s = x; while (x < w && dark[row + x]) x++; now.add(s + ',' + x); } else x++;
            }
          }
          const next = new Map();
          now.forEach((k) => { next.set(k, open.has(k) ? open.get(k) : y); });
          open.forEach((y0, k) => { if (!now.has(k)) emit(k + ',' + y0, y); });
          open = next;
        }

      }
      function imgLoad(file) {
        return new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onerror = () => rej(new Error('Gagal membaca file.'));
          fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('File bukan gambar yang valid.')); im.src = fr.result; };
          fr.readAsDataURL(file);

      }
      function imgDraw(im, maxW) {
        const sc = Math.min(1, maxW / im.naturalWidth);
        const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;

        return { c, ctx, w, h };

      function imgToEmbedSvg(im) { // tertanam: gambar dikecilkan & dibungkus SVG

        for (const [mw, q] of tries) {

          const px = ctx.getImageData(0, 0, w, h).data; let alpha = false;
          for (let i = 3; i < px.length; i += 4) if (px[i] < 250) { alpha = true; break; }
          let uri;
          if (alpha) uri = c.toDataURL('image/png');
          else { const c2 = document.createElement('canvas'); c2.width = w; c2.height = h; const x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, w, h); x2.drawImage(c, 0, 0); uri = x2.toDataURL('image/jpeg', q); }
          const svg = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '"><image href="' + uri + '" xlink:href="' + uri + '" width="' + w + '" height="' + h + '"/></svg>';

      function imgToTraceSvg(im) { // vektor sederhana hitam-putih untuk diagram/sketsa
        const { ctx, w, h } = imgDraw(im, 640);

        const g = new Uint8Array(w * h);
        for (let i = 0, p = 0; i < px.length; i += 4, p++) g[p] = px[i + 3] < 128 ? 255 : Math.round(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
        const thr = Math.min(200, imgOtsu(g));

        if (!n || n > w * h * 0.6) throw new Error('Gambar tidak cocok untuk vektorisasi (terlalu gelap/berwarna). Pilih mode "Tertanam".');
        const col = 'rgb(' + Math.round(r / n) + ',' + Math.round(gg / n) + ',' + Math.round(b / n) + ')';
        const d = imgTrace(dark, w, h);
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '"><rect width="100%" height="100%" fill="#fff"/><path fill="' + col + '" shape-rendering="crispEdges" d="' + d + '"/></svg>';

      const listEl = document.getElementById('questionListContainer');
      const soalSel = new Set(Array.isArray(window.__bankPreselect) ? window.__bankPreselect : []);
      window.__bankPreselect = null;

      function keyPreviewHtml(q) { return qKeyPreviewHtml(q); }

      function getShown() {
        const qText = String(state.soalSearch || '').trim().toLowerCase();
        const tf = state.soalTypeFilter || 'ALL';
        const af = state.soalAtpFilter || 'ALL';
        const tpf = state.soalTopikFilter || 'ALL';
        const ov = soalOwnerView();
        return state.questions.map((q, i) => ({ q, i })).filter(({ q }) => {
          if (ov && String(q.owner || 'admin') !== ov) return false;
          if (tpf !== 'ALL' && topikOf(q) !== tpf) return false;
          if (tf !== 'ALL' && q.type !== tf) return false;
          const a = getQuestionAtp(q);
          if (af === 'NONE' && a) return false;
          if (af !== 'ALL' && af !== 'NONE' && a !== af) return false;
          if (qText) {
            const hay = (String(q.prompt || '') + ' ' + (q.options || []).join(' ') + ' ' + String(q.kd || '')).toLowerCase();
            if (!hay.includes(qText)) return false;
          }
          return true;
        });
      }

      function renderBankSummary() {
        const el = document.getElementById('bankSummary');
        if (!el) return;
        const total = visibleQuestions().length;
        if (!total) {
          el.innerHTML = '<div class="text-xs text-slate-500">Bank soal masih kosong. Buka tab <strong>Buat Soal</strong>: tulis manual, buat otomatis, atau impor Excel/Word/AI/JSON.</div>';
          return;
        }
        const byType = {};
        const byAtp = {};
        let noAtp = 0;
        const noTopik = visibleQuestions().filter((q) => !q.topik).length;
        visibleQuestions().forEach((q) => {
          byType[q.type] = (byType[q.type] || 0) + 1;
          const a = getQuestionAtp(q);
          if (a) byAtp[a] = (byAtp[a] || 0) + 1; else noAtp++;
        });
        const missing = ATP_LIST.filter((a) => !byAtp[a.kode]);
        const chip = (txt, cls) => `<span class="px-2.5 py-1 rounded-lg border text-[11px] font-semibold ${cls}">${txt}</span>`;
        el.innerHTML = `
          <div class="flex flex-wrap gap-1.5">
            ${chip(`Total <strong>${total}</strong> soal`, 'bg-slate-800 border-slate-800 text-white')}
            ${typeKeysList.filter((t) => byType[t]).map((t) => chip(`${escapeHtml(typeBadges[t])} <strong>${byType[t]}</strong>`, 'bg-white border-slate-200 text-slate-700')).join('')}
          </div>
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            ${ATP_LIST.filter((a) => byAtp[a.kode]).map((a) => chip(`${escapeHtml(a.kode.replace('ATP-', ''))} <strong>${byAtp[a.kode]}</strong>`, 'bg-sky-50 border-sky-200 text-sky-900')).join('')}
            ${noAtp ? chip(`Tanpa ATP <strong>${noAtp}</strong>`, 'bg-slate-50 border-slate-200 text-slate-600') : ''}
          </div>
          ${missing.length ? `<div class="mt-1.5 text-[11px] text-amber-800">ATP belum memiliki soal: ${missing.map((a) => escapeHtml(a.kode)).join(', ')}</div>` : ''}
          ${noTopik ? `<div class="mt-1.5 flex flex-wrap items-center gap-2 text-[11px] text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5"><span><strong>${noTopik}</strong> soal belum diberi topik sendiri, sehingga dikelompokkan otomatis menurut Elemen CP. Paket ujian sebaiknya per materi (mis. &quot;Algoritma Pencarian&quot;).</span><button type="button" id="btnFixTopik" class="px-2.5 py-1 rounded-md bg-amber-600 hover:bg-amber-700 text-white font-bold cursor-pointer">Pilih &amp; beri topik</button></div>` : ''}`;
        const fx = document.getElementById('btnFixTopik');
        if (fx) fx.addEventListener('click', () => {
          state.soalSearch = ''; state.soalTypeFilter = 'ALL'; state.soalAtpFilter = 'ALL'; state.soalTopikFilter = 'ALL';
          window.__bankPreselect = visibleQuestions().filter((q) => !q.topik).map((q) => q.id);
          window.__bankOpenTopikModal = true;
          saveState(); renderAdminView();
        });
      }

      function renderBulkBar(shown) {
        const bar = document.getElementById('bankBulkBar');
        if (!bar) return;
        if (!visibleQuestions().length) { bar.innerHTML = ''; return; }

              <input type="checkbox" id="bankSelectAll" ${allChecked ? 'checked' : ''} class="w-4 h-4 rounded" /> Pilih semua yang tampil (${shown.length})

            <div class="flex flex-wrap gap-2">
              <button id="btnBulkTopik" type="button" ${n ? '' : 'disabled'} class="px-3 py-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 disabled:opacity-40 text-sky-800 text-xs font-bold cursor-pointer">Atur Topik (${n})</button>
              <button id="btnBulkPoints" type="button" ${n ? '' : 'disabled'} class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-800 text-xs font-bold cursor-pointer">Ubah Poin (${n})</button>

        document.getElementById('btnBulkPoints').addEventListener('click', () => {

          document.getElementById('bulkPtsSave').addEventListener('click', () => {

            state.questions.forEach((q) => { if (soalSel.has(q.id)) q.points = v; });

            closeModal();
            renderAdminView();

        document.getElementById('btnBulkDelete').addEventListener('click', () => {

          document.getElementById('bulkDelOk').addEventListener('click', () => {
            const cnt = soalSel.size;
            if (document.getElementById('bulkDelBackup').checked) downloadJsonFile('Cadangan_Soal_Terhapus_' + new Date().toISOString().slice(0, 10) + '.json', state.questions.filter((q) => soalSel.has(q.id)));
            state.questions = state.questions.filter((q) => !soalSel.has(q.id));

      function renderList() {
        const shown = getShown();
        { const vis = new Set(shown.map((x) => x.q.id)); Array.from(soalSel).forEach((id) => { if (!vis.has(id)) soalSel.delete(id); }); } // v9: pilihan yang tersaring tidak ikut terhapus/terubah

        if (tp) tp.textContent = String(visibleQuestions().reduce((acc, q) => acc + (Number(q.points) || 0), 0));
        renderTopikBar();
        renderBankSummary();
        renderBulkBar(shown);
        const seq = new Map(visibleQuestions().map((q, n) => [q.id, n + 1]));
        const showKey = state.soalShowKey !== false;
        if (!visibleQuestions().length) {
          listEl.innerHTML = '';
          return;
        }
        if (!shown.length) {
          listEl.innerHTML = '<div class="p-8 text-center rounded-2xl bg-white border border-dashed border-slate-300 text-sm text-slate-500">Tidak ada soal yang cocok dengan filter saat ini.</div>';
          return;
        }
        const cardHtml = ({ q, i }, nTopik) => {
          const atp = getQuestionAtp(q);
          return `
            <div class="bg-white rounded-2xl p-4 sm:p-5 border ${soalSel.has(q.id) ? 'border-anbk-blue ring-2 ring-blue-500/15' : 'border-slate-200'} shadow-2xs space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-2">

                  <span class="px-2.5 py-0.5 rounded-lg bg-sky-50 text-anbk-blue border border-sky-200 text-xs font-semibold">${escapeHtml(typeBadges[q.type] || q.type)}</span>
                  ${atp ? `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-[11px] font-semibold">${escapeHtml(atp)}</span>` : `<span class="text-xs text-slate-500">${escapeHtml(q.kd || '')}</span>`}
                  ${q.levelKognitif ? `<span class="px-2 py-0.5 rounded-md bg-violet-50 text-violet-800 text-[11px] font-semibold">${escapeHtml(q.levelKognitif)}</span>` : ''}
                </div>
                <span class="text-xs font-bold text-slate-700">${Number(q.points || 10)} Poin</span>
              </div>
              <div class="text-sm text-slate-800 leading-relaxed">${renderRichContent(stripLegacyPrefix(q.prompt))}</div>
              ${showKey ? `<div class="pt-1">${keyPreviewHtml(q)}</div>` : ''}
              <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" data-edit-q="${escapeHtml(q.id)}" class="edit-q-btn px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold cursor-pointer">Edit</button>
                <button type="button" data-del-q="${escapeHtml(q.id)}" class="del-q-btn px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold cursor-pointer">Hapus</button>
              </div>
            </div>`;
        };
        const groups = new Map();
        shown.forEach((it) => { const t = topikOf(it.q); if (!groups.has(t)) groups.set(t, []); groups.get(t).push(it); });
        const closedMap = state.soalTopikClosed || {};
        const typeOrd = (tp) => { const k = typeKeysList.indexOf(tp); return k < 0 ? 99 : k; };
        listEl.innerHTML = Array.from(groups.keys()).sort((a, b2) => a.localeCompare(b2, 'id', { numeric: true })).map((name) => {
          const items = groups.get(name).slice().sort((x, y) => typeOrd(x.q.type) - typeOrd(y.q.type) || x.i - y.i);
          const pts = items.reduce((acc, it) => acc + (Number(it.q.points) || 0), 0);
          const allInTopik = visibleQuestions().filter((q) => topikOf(q) === name);
          const ptsAll = allInTopik.reduce((acc, q) => acc + (Number(q.points) || 0), 0);
          const byT = {}; allInTopik.forEach((q) => { byT[q.type] = (byT[q.type] || 0) + 1; });
          const typeChips = typeKeysList.filter((k) => byT[k]).map((k) => `<span class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-[10px] font-semibold text-slate-600">${escapeHtml(typeBadges[k])} ${byT[k]}</span>`).join(' ');
          const okPts = ptsAll === 100;
          const ptsChip = `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${okPts ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}" title="Skor ujian per topik idealnya berjumlah 100">${okPts ? '&#10003; 100 poin' : ptsAll + ' poin &ne; 100'}</span>`;
          const normBtn = okPts ? '' : `<button type="button" data-topik="${escapeHtml(name)}" class="topik-norm-btn px-2 py-0.5 rounded-md bg-white border border-amber-300 hover:bg-amber-50 text-[11px] font-bold text-amber-800 cursor-pointer">Skala ke 100</button>`;
          const filtered = items.length !== allInTopik.length ? ` <span class="font-normal text-slate-500">(tampil ${items.length} dari ${allInTopik.length})</span>` : '';
          return `<details data-topik="${escapeHtml(name)}" ${closedMap[name] ? '' : 'open'} class="bank-topik-group rounded-2xl border border-slate-300 bg-slate-50/70">
            <summary class="px-4 py-3 cursor-pointer select-none list-none space-y-1.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="flex items-center gap-2 min-w-0"><span class="px-2.5 py-0.5 rounded-lg bg-anbk-blue text-white text-[11px] font-bold uppercase tracking-wide">Topik</span><span class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(name)}</span></span>
                <span class="flex flex-wrap items-center gap-1.5 text-xs font-semibold text-slate-600">${allInTopik.length} soal${filtered} ${ptsChip} ${normBtn}</span>
              </div>
              <div class="flex flex-wrap gap-1">${typeChips}</div>
            </summary>
            <div class="px-3 pb-3 space-y-3">${items.map((it, k) => cardHtml(it, k + 1)).join('')}</div>
          </details>`;
        }).join('');
        listEl.querySelectorAll('details.bank-topik-group').forEach((d) => d.addEventListener('toggle', () => {
          if (!state.soalTopikClosed) state.soalTopikClosed = {};
          state.soalTopikClosed[d.getAttribute('data-topik')] = !d.open;
        }));
      }

      function renderTopikBar() {
        const bar = document.getElementById('bankTopikBar');
        if (!bar) return;
        const base = visibleQuestions();
        const cnt = new Map();
        base.forEach((q) => { const t = topikOf(q); cnt.set(t, (cnt.get(t) || 0) + 1); });
        if (!cnt.size) { bar.innerHTML = ''; return; }

      function loadIntoForm(found, draftId) {
        if (window.__bankGoto) window.__bankGoto('buat', 'manual');

        document.getElementById('qFormTitle').textContent = `Edit Soal (${found.id})`;

      }
      window.__loadFormFrom = loadIntoForm;

      function normalizeDialog(name) {
        const qs = visibleQuestions().filter((q) => topikOf(q) === name);
        const sum = qs.reduce((a, q) => a + (Number(q.points) || 0), 0);
        if (!qs.length || !sum) return;
        const raw = qs.map((q) => (Number(q.points) || 0) * 100 / sum);
        const pts = raw.map((r) => Math.max(1, Math.floor(r)));
        let diff = 100 - pts.reduce((a, b2) => a + b2, 0);
        const byRem = raw.map((r, i) => ({ i, rem: r - Math.floor(r) })).sort((a, b2) => b2.rem - a.rem);
        for (let k = 0; diff > 0 && byRem.length; k = (k + 1) % byRem.length) { pts[byRem[k].i]++; diff--; }
        const byBig = pts.map((p, i) => ({ i, p })).sort((a, b2) => b2.p - a.p);
        for (let k = 0; diff < 0 && byBig.length; k = (k + 1) % byBig.length) { if (pts[byBig[k].i] > 1) { pts[byBig[k].i]--; diff++; } else if (byBig.every((x) => pts[x.i] <= 1)) break; }
        const inUse = topikInUse(name);
        openModal(`<h3 class="text-lg font-bold text-slate-900">Skala poin topik ke 100?</h3>
          <p class="text-sm text-slate-700">Topik <strong>${escapeHtml(name)}</strong>: total saat ini <strong>${sum}</strong> poin dari ${qs.length} soal. Poin tiap soal diubah secara proporsional sehingga jumlahnya <strong>100</strong> (pembulatan dibagi adil, minimal 1 poin per soal).</p>
          ${inUse ? '<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2">Topik ini aktif atau sudah dikerjakan siswa. Nilai yang sudah tersimpan tidak dihitung ulang.</p>' : ''}
          <div class="flex justify-end gap-2 pt-3"><button id="normCancel" type="button" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold cursor-pointer">Batal</button><button id="normOk" type="button" class="px-4 py-2 rounded-xl bg-anbk-blue hover:bg-blue-800 text-white text-sm font-bold cursor-pointer">Terapkan</button></div>`);
        document.getElementById('normCancel').addEventListener('click', closeModal);
        document.getElementById('normOk').addEventListener('click', () => {
          qs.forEach((q, i) => { q.points = pts[i]; });
          saveState(); closeModal(); renderAdminView();
          showToast('Poin topik "' + name + '" diskalakan menjadi total 100.', 'success');
        });
      }

      listEl.addEventListener('click', (ev) => {
        const nb = ev.target.closest('.topik-norm-btn');
        if (nb) { ev.preventDefault(); ev.stopPropagation(); normalizeDialog(nb.getAttribute('data-topik')); return; }
        const eb = ev.target.closest('.edit-q-btn');

          const qId = db.getAttribute('data-del-q');

            <h3 class="text-lg font-bold text-slate-900">Hapus butir soal ini?</h3>

      function upsertStudentsList(list) {
        if (guruBlock()) return;
        let count = 0;
        list.forEach((item) => {
          const nis = String(item.nis || '').trim();
          const name = String(item.name || '').trim();
          const kelas = String(item.kelas || 'XI-A').trim();
          const pw = String(item.password || '').trim();
          if (!nis || !name) return;
          const idx = state.students.findIndex((s) => String(s.nis).trim() === nis);
          if (idx !== -1) {
            state.students[idx] = { ...state.students[idx], name, kelas, ...(pw ? { password: pw } : {}) };
          } else {
            state.students.push({
              nis,
              name,
              kelas,
              password: pw,
              status: 'belum',
              locked: false,
              violations: 0,
              violationLogs: [],
              lastActive: null
            });
          }
          count++;
        });
        saveState();
        renderAdminView();
        if (count === 0) showToast('Tidak ada data valid. Pastikan NIS dan Nama terisi.', 'warning');
        else showToast(`${count} data siswa berhasil disimpan.`, 'success');

        const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const parsed = lines.map((line) => {
          const parts = line.includes('\t') ? line.split('\t') : line.split(',');
          return {
            nis: (parts[0] || '').trim(),
            name: (parts[1] || '').trim(),
            kelas: (parts[2] || 'XI-A').trim(),
            password: (parts[3] || '').trim()
          };
        });
        upsertStudentsList(parsed.filter((x) => !/^nis$/i.test(x.nis)));
      });

      // ---------------------------------------------------------------------
      // IMPORT FILE SISWA (.xlsx / .xls / .csv / .json)
      // Mendukung: (1) daftar nama per kelas dengan blok "Kelas XI.F-1" + baris
      // header "No. Urut | NISN | NIS | Nama Siswa", (2) tabel biasa NIS/Nama/Kelas.
      // ---------------------------------------------------------------------
      function normalizeKelas(raw) {
        let t = String(raw || '').trim().replace(/^kelas\s*/i, '').toUpperCase().replace(/\s+/g, '').replace(/\./g, '-');
        t = t.replace(/([A-Z])-(\d+)$/, '$1$2'); // XI-F-1 -> XI-F1
        return t || 'XI-A';
      }

      function parseSiswaRows(rows) {
        const out = [];
        let cur = '';
        let cNis = -1, cName = -1, cKelas = -1, cPass = -1;
        rows.forEach((row) => {
          if (!Array.isArray(row)) return;
          const cells = row.map((c) => (c === null || c === undefined ? '' : String(c).trim()));
          const lbl = cells.find((c) => /^kelas\s+x/i.test(c));
          if (lbl) { cur = normalizeKelas(lbl); return; }
          const low = cells.map((c) => c.toLowerCase());
          let iNis = low.indexOf('nis');
          if (iNis === -1) iNis = low.indexOf('nisn');
          const iName = low.findIndex((c) => /^nama(\s+(siswa|lengkap|peserta))?$/.test(c));
          if (iNis !== -1 && iName !== -1) {
            cNis = iNis;
            cName = iName;
            cKelas = low.findIndex((c) => c === 'kelas' || c === 'rombel');
            cPass = low.findIndex((c) => /^(password|kata\s*sandi|sandi|pass)$/.test(c));
            return;
          }
          if (cNis === -1) return;
          const nis = cells[cNis];
          const name = cells[cName];
          if (!/^\d{3,}$/.test(nis) || !/[A-Za-z]/.test(name)) return;
          const kelas = (cKelas !== -1 && cells[cKelas]) ? normalizeKelas(cells[cKelas]) : (cur || 'XI-A');
          out.push({ nis, name: name.replace(/\s+/g, ' '), kelas, password: cPass !== -1 ? cells[cPass] : '' });
        });
        return out;
      }

      function dedupeByNis(list) {
        const map = new Map();
        list.forEach((it) => map.set(String(it.nis).trim(), it));
        return Array.from(map.values());
      }

      function replaceStudentsList(list) {
        if (guruBlock()) return;
        const old = new Map(state.students.map((x) => [String(x.nis).trim(), x]));
        state.students = list.map((it) => old.has(it.nis)
          ? { ...old.get(it.nis), name: it.name, kelas: it.kelas, ...(it.password ? { password: it.password } : {}) }
          : { nis: it.nis, name: it.name, kelas: it.kelas, password: it.password || '', status: 'belum', locked: false, violations: 0, violationLogs: [], lastActive: null });
        const keep = new Set(state.students.map((x) => String(x.nis).trim()));
        state.submissions = (state.submissions || []).filter((sb) => keep.has(String(sb.nis).trim()));
        if (state.session && state.session.activeExam && !keep.has(String(state.session.activeExam.nis).trim())) {
          state.session.activeExam = null;
        }
        state.siswaClassFilter = 'ALL';
        state.siswaSearchQuery = '';
        saveState();
        renderAdminView();
        showToast(`Daftar peserta diganti: ${state.students.length} siswa.`, 'success');
      }

      function confirmImportSiswa(list, fileName) {

        const perClass = {};

        const classKeys = Object.keys(perClass).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
        openModal(`
          <h3 class="text-lg font-bold text-slate-900">Import ${list.length} siswa dari file?</h3>
          <p class="text-xs text-slate-500 break-all">${escapeHtml(fileName)}</p>

            <div class="rounded-xl bg-emerald-50 border border-emerald-200 py-2"><div class="text-lg font-extrabold text-emerald-800">${newCount}</div><div class="text-[11px] text-emerald-700 font-semibold">Baru</div></div>

            <p><strong>Ganti Semua:</strong> daftar sekarang (${state.students.length} siswa) dihapus dan diganti isi file. Nilai milik siswa yang tidak ada di file ikut terhapus.</p>
          </div>
          <div class="flex flex-wrap justify-end gap-2 pt-2">
            <button id="impCancelBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold cursor-pointer">Batal</button>

        document.getElementById('impMergeBtn').addEventListener('click', () => { closeModal(); upsertStudentsList(list); });

      const impStuFile = document.getElementById('importSiswaFile');
      if (impStuFile) {
        impStuFile.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const isJson = file.name.toLowerCase().endsWith('.json');
          const reader = new FileReader();
          reader.onload = function (ev) {
            try {
              let list = [];
              if (isJson) {
                const arr = JSON.parse(ev.target.result);
                if (Array.isArray(arr)) list = arr.map((x) => ({
                  nis: String(x.nis || x.NIS || '').trim(),
                  name: String(x.name || x.nama || x.Nama || '').trim(),
                  kelas: normalizeKelas(x.kelas || x.Kelas || 'XI-A'),
                  password: String(x.password || x.Password || x.sandi || '').trim()
                })).filter((x) => x.nis && x.name);
              } else {
                const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                wb.SheetNames.forEach((sn) => {
                  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
                  list = list.concat(parseSiswaRows(rows));

              list = dedupeByNis(list);

                return;
              }
              confirmImportSiswa(list, file.name);
            } catch (err) {
              console.error(err);
              showToast('Gagal mengimpor data siswa.', 'danger');
            } finally {
              impStuFile.value = '';
            }
          };
          if (isJson) reader.readAsText(file); else reader.readAsArrayBuffer(file);
        });
      }

      document.getElementById('btnSecRotateNow').addEventListener('click', () => {

      });

      document.getElementById('btnSaveAntiCheat').addEventListener('click', () => {

        const tokInterval = Math.max(1, parseInt(document.getElementById('secTokenInterval').value, 10) || 5);
        const tabDet = document.getElementById('secTabDetect').checked;
        const maxViol = Math.max(1, parseInt(document.getElementById('secMaxViolations').value, 10) || 3);
        const actMode = document.getElementById('secActionMode').value;
        const autoSubTimeout = document.getElementById('secAutoSubmitTimeout').checked;

        state.autoRotateToken = autoRot;
        state.tokenRotateIntervalMinutes = tokInterval;
        state.tokenNextRotateAt = autoRot ? (Date.now() + tokInterval * 60 * 1000) : null;

        state.antiCheat = {
          ...state.antiCheat,
          tabSwitchDetection: tabDet,
          maxViolations: maxViol,
          actionMode: actMode,
          autoSubmitOnTimeout: autoSubTimeout,
          strictMode: Boolean((document.getElementById('secStrictMode') || {}).checked)

        setupTokenRotation();
        renderAdminView();
