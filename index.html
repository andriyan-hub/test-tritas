    // -------------------------------------------------------------------------
    // REKAP NILAI & KOREKSI ESAI MANUAL + EXPORT
    // -------------------------------------------------------------------------
    function renderAdminRekapTab(container) {
      const rekapQsSnap = (state.questions || []).slice();
      const essayQuestions = state.questions.filter((q) => q.type === 'esai');
      const kktp = getKktp();
      const selectedClass = state.rekapClassFilter || 'ALL';

      // Collect unique class names from students & submissions
      const classSet = new Set();
      (state.students || []).forEach((s) => {
        if (s && s.kelas) classSet.add(String(s.kelas).trim());
      });
      (state.submissions || []).forEach((sub) => {
        if (sub && sub.kelas) classSet.add(String(sub.kelas).trim());
      });
      const classList = Array.from(classSet).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));

      // Build per-class summary cards across all classes
      const perClassSummaries = classList.map((clsName) => {
        const clsStudents = (state.students || []).filter((s) => String(s.kelas || '').trim() === clsName);
        const clsSubs = (state.submissions || []).filter((sub) => String(sub.kelas || '').trim() === clsName);
        const avgPct = clsSubs.length > 0
          ? Math.round(clsSubs.reduce((sum, item) => sum + computeFinalScore(item).percent, 0) / clsSubs.length)
          : 0;
        const passCount = clsSubs.filter((item) => computeFinalScore(item).percent >= kktp).length;
        return {
          kelas: clsName,
          totalStudents: clsStudents.length,
          submittedCount: clsSubs.length,
          avgPct,
          passCount
        };
      });

      const filteredSubmissions = selectedClass === 'ALL'
        ? state.submissions
        : state.submissions.filter((sub) => String(sub.kelas || '').trim() === selectedClass);

      // ---- Rekap nilai SELURUH siswa (termasuk yang belum mengerjakan) ----
      const subByNis = new Map();
      (state.submissions || []).forEach((sub) => subByNis.set(String(sub.nis).trim(), sub));
      const classStudents = (state.students || [])
        .filter((st) => selectedClass === 'ALL' || String(st.kelas || '').trim() === selectedClass)
        .slice()
        .sort((a, b) =>
          String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id', { numeric: true }) ||
          String(a.name || '').localeCompare(String(b.name || ''), 'id'));
      const rekapSeen = new Set();
      const rekapAllRows = classStudents.map((st) => {
        const nis = String(st.nis).trim();
        rekapSeen.add(nis);
        const sub = subByNis.get(nis) || null;
        const isLocked = Boolean(st.locked) || st.status === 'terkunci';
        const statusKey = sub ? 'selesai' : isLocked ? 'terkunci' : (st.status === 'sedang_ujian' ? 'sedang_ujian' : 'belum');
        return { nis, name: st.name, kelas: st.kelas, sub, fin: sub ? computeFinalScore(sub) : null, statusKey };
      });
      filteredSubmissions.forEach((sub) => {
        const nis = String(sub.nis).trim();
        if (rekapSeen.has(nis)) return;
        rekapAllRows.push({ nis, name: sub.studentName, kelas: sub.kelas, sub, fin: computeFinalScore(sub), statusKey: 'selesai' });
      });
      rekapAllRows.forEach((r) => {
        r.essayPending = Boolean(r.sub) && essayQuestions.some((eq) => !isEssayGraded(r.sub, eq.id));
      });
      const doneRows = rekapAllRows.filter((r) => r.sub);
      const pendingEssayRows = doneRows.filter((r) => r.essayPending).length;
      const pcts = doneRows.map((r) => r.fin.percent);
      const rekapStats = {
        total: rekapAllRows.length,
        done: doneRows.length,
        pending: rekapAllRows.length - doneRows.length,
        avg: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null,
        max: pcts.length ? Math.max(...pcts) : null,
        min: pcts.length ? Math.min(...pcts) : null,
        pass: doneRows.filter((r) => r.fin.percent >= kktp).length
      };
      const rekapStatusFilter = state.rekapStatusFilter || 'ALL';
      const rekapRows = rekapAllRows.filter((r) =>
        rekapStatusFilter === 'sudah' ? Boolean(r.sub)
          : rekapStatusFilter === 'belum' ? !r.sub
            : rekapStatusFilter === 'tuntas' ? (Boolean(r.sub) && r.fin.percent >= kktp)
              : rekapStatusFilter === 'remidi' ? (Boolean(r.sub) && r.fin.percent < kktp)
                : true);
      if (state.rekapSortNilai) rekapRows.sort((a, b) => (b.fin ? b.fin.percent : -1) - (a.fin ? a.fin.percent : -1));
      const rekapStatusBadge = (key) => {
        const map = {
          selesai: ['Selesai', 'bg-emerald-100 text-emerald-800', 'bg-emerald-500'],
          sedang_ujian: ['Sedang Ujian', 'bg-amber-100 text-amber-800', 'bg-amber-500'],
          terkunci: ['Terkunci', 'bg-rose-100 text-rose-800', 'bg-rose-500'],
          belum: ['Belum Mengerjakan', 'bg-slate-100 text-slate-600', 'bg-slate-400']

        const m = map[key] || map.belum;
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${m[1]}"><span class="w-1.5 h-1.5 rounded-full ${m[2]}"></span>${m[0]}</span>`;
      };
      const rekapChip = (label, val, cls) => `
        <div class="px-3 py-2 rounded-xl border ${cls}">
          <div class="text-lg font-extrabold leading-none">${val}</div>

      const rekapTableHtml = `

                <div class="text-xs text-slate-500">Nilai = skor objektif + skor esai. Siswa yang belum mengumpulkan tetap ditampilkan.</div>
              </div>
              <div class="text-xs text-slate-500">Menampilkan <strong class="text-slate-800">${rekapRows.length}</strong> dari <strong class="text-slate-800">${rekapStats.total}</strong> siswa</div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 px-5 py-3 border-b border-slate-100">
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mr-1">Status:</span>
              ${[['ALL', 'Semua', rekapStats.total], ['sudah', 'Sudah Mengerjakan', rekapStats.done], ['belum', 'Belum Mengerjakan', rekapStats.pending], ['tuntas', 'Tuntas', rekapStats.pass], ['remidi', 'Remidi', rekapStats.done - rekapStats.pass]].map(([key, label, n]) => {
                const active = rekapStatusFilter === key;
                return `<button type="button" data-rekap-status="${key}" class="rekap-status-btn px-3 py-1.5 rounded-full border text-xs font-bold cursor-pointer transition ${active ? 'bg-anbk-blue border-anbk-blue text-white' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-100'}">${label} <span class="${active ? 'text-blue-100' : 'text-slate-400'} font-semibold">${n}</span></button>`;
              }).join('')}
              <button type="button" id="btnRekapSort" class="ml-auto px-3 py-1.5 rounded-full border border-slate-300 bg-white text-xs font-bold text-slate-700 cursor-pointer">Urut: ${state.rekapSortNilai ? 'Nilai tertinggi' : 'Nama'}</button>
            </div>
            ${pendingEssayRows > 0 ? `
              <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-3 bg-amber-50 border-b border-amber-200">
                <div class="text-xs sm:text-sm text-amber-900"><strong>${pendingEssayRows} siswa</strong> masih punya esai yang belum dinilai. Nilai bertanda <strong>*</strong> belum termasuk skor esai.</div>
                <button id="btnGoKoreksi" type="button" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold cursor-pointer">Buka Koreksi Esai</button>
              </div>` : ''}
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5 p-4 border-b border-slate-100">
              ${rekapChip('Siswa', rekapStats.total, 'bg-slate-50 border-slate-200 text-slate-800')}
              ${rekapChip('Sudah Mengerjakan', rekapStats.done, 'bg-emerald-50 border-emerald-200 text-emerald-900')}
              ${rekapChip('Belum', rekapStats.pending, 'bg-slate-50 border-slate-200 text-slate-700')}
              ${rekapChip('Rata-rata', rekapStats.avg === null ? '-' : rekapStats.avg + '%', 'bg-sky-50 border-sky-200 text-sky-900')}
              ${rekapChip('Tertinggi', rekapStats.max === null ? '-' : rekapStats.max + '%', 'bg-white border-slate-200 text-slate-800')}
              ${rekapChip('Terendah', rekapStats.min === null ? '-' : rekapStats.min + '%', 'bg-white border-slate-200 text-slate-800')}
              ${rekapChip('Tuntas KKTP ≥ ' + kktp + '%', rekapStats.pass + ' / ' + rekapStats.done, 'bg-amber-50 border-amber-200 text-amber-900')}
            </div>
            <div class="overflow-auto max-h-[70vh] rt-wrap rt-print-all">
              <table class="rtable w-full text-left border-separate border-spacing-0 text-sm">
                <thead>
                  <tr class="text-[11px] uppercase tracking-wider text-slate-600">
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 pl-5 pr-2 w-14 text-center">No</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-28">NIS</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3">Nama Siswa</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-24">Kelas</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-44">Status</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-24 text-center">Objektif</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-20 text-center">Esai</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 px-3 w-28 text-center">Total</th>
                    <th class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-3 pl-3 pr-5 w-40 text-center">Nilai / KKTP</th>
                  </tr>
                </thead>
                <tbody>
                  ${rekapRows.length === 0
                    ? `<tr><td colspan="9" class="py-12 px-4 text-center text-slate-500">Tidak ada siswa pada filter ini.</td></tr>`
                    : rekapRows.map((r, i) => {
                      const rowBg = i % 2 === 1 ? 'bg-slate-50/60' : 'bg-white';
                      const cell = `border-b border-slate-100 ${rowBg} group-hover:bg-sky-50 transition-colors`;
                      const has = Boolean(r.sub);
                      const passed = has && r.fin.percent >= kktp;
                      const maxTotal = has ? Number(r.sub.maxTotalScore || 100) : 0;
                      return `
                        <tr class="group">
                          <td data-label="No" class="${cell} py-3 pl-5 pr-2 text-center font-mono text-xs text-slate-400">${i + 1}</td>
                          <td data-label="NIS" class="${cell} py-3 px-3 font-mono text-[13px] font-semibold text-slate-800">${escapeHtml(r.nis)}</td>
                          <td data-label="Nama" class="${cell} py-3 px-3 font-semibold text-slate-900">${escapeHtml(r.name)}</td>
                          <td data-label="Kelas" class="${cell} py-3 px-3"><span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-xs font-semibold whitespace-nowrap">${escapeHtml(r.kelas)}</span></td>
                          <td data-label="Status" class="${cell} py-3 px-3">${rekapStatusBadge(r.statusKey)}</td>
                          <td data-label="Objektif" class="${cell} py-3 px-3 text-center font-mono">${has ? Number(r.sub.autoScore || 0) : '-'}</td>
                          <td data-label="Esai" class="${cell} py-3 px-3 text-center font-mono">${has ? (r.essayPending ? '<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[11px] font-bold whitespace-nowrap">Belum dinilai</span>' : Number(r.sub.essayScore || 0)) : '-'}</td>
                          <td data-label="Total" class="${cell} py-3 px-3 text-center font-mono font-bold text-slate-900">${has ? `${r.fin.total}<span class="text-slate-400 font-normal"> / ${maxTotal}</span>` : '-'}</td>
                          <td data-label="Nilai" class="${cell} py-3 pl-3 pr-5 text-center">${has
                            ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-extrabold whitespace-nowrap ${passed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.fin.percent}%${r.essayPending ? '*' : ''}<span class="font-semibold">${passed ? 'Tuntas' : 'Remidi'}</span></span>`

                        </tr>
                      `;
                    }).join('')
                  }
                </tbody>
              </table>

      container.innerHTML = `
        <div class="space-y-6">

            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-lg font-bold text-slate-900">Rekap Nilai</h2>
                <p class="text-xs text-slate-500">Acuan KKTP: <strong>${kktp}%</strong> • Filter per kelas, ekspor, dan cetak. Skor esai dinilai di menu <strong>Koreksi Esai</strong>.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select id="rekapClassFilterSelect" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs sm:text-sm font-bold text-slate-800 focus:border-anbk-blue outline-none">
                  <option value="ALL" ${selectedClass === 'ALL' ? 'selected' : ''}>Semua Kelas (${state.submissions.length})</option>
                  ${classList.map((c) => {
                    const cnt = state.submissions.filter((s) => String(s.kelas || '').trim() === c).length;
                    return `<option value="${escapeHtml(c)}" ${selectedClass === c ? 'selected' : ''}>Kelas ${escapeHtml(c)} (${cnt})</option>`;
                  }).join('')}
                </select>
                <button id="btnOpenRekapKelas" type="button" class="px-3.5 py-2 rounded-xl bg-anbk-blue hover:bg-blue-800 text-white text-xs font-bold cursor-pointer">
                  Lihat Tabel Kelas
                </button>
                <button id="btnExportRekapXlsx" type="button" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">
                  Export Rekap .XLSX
                </button>
                <button id="btnExportRekapCsv" type="button" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer">
                  Export .CSV
                </button>
                <button id="btnPrintRekap" type="button" class="px-3.5 py-2 rounded-xl bg-anbk-navy hover:bg-anbk-navyDark text-white text-xs font-bold cursor-pointer">
                  Cetak / PDF
                </button>
              </div>
            </div>

            <!-- Ringkasan Rekap Nilai Siswa Per Kelas -->
            <div class="pt-2 border-t border-slate-100 space-y-2.5">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-600">Ringkasan Rekap Nilai Per Kelas</div>
              ${perClassSummaries.length === 0
                ? '<div class="text-xs text-slate-500">Belum ada data kelas terdaftar.</div>'
                : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${perClassSummaries.map((item) => {
                      const isSelected = selectedClass === item.kelas;
                      return `

                          <div class="flex items-center justify-between gap-2">

      const goKoreksiBtn = document.getElementById('btnGoKoreksi');

      function buildRekapRows() {
        return rekapRows.map((r, i) => {
          const sub = r.sub;
          const fin = r.fin;
          return {
            No: i + 1,
            NIS: r.nis,
            Nama: r.name,
            Kelas: r.kelas,
            Status: sub ? 'Selesai' : (r.statusKey === 'terkunci' ? 'Terkunci' : r.statusKey === 'sedang_ujian' ? 'Sedang Ujian' : 'Belum Mengerjakan'),
            Skor_Objektif: sub ? Number(sub.autoScore || 0) : '',
            Skor_Esai: sub ? Number(sub.essayScore || 0) : '',
            Esai_Status: sub ? (r.essayPending ? 'Belum dinilai' : (essayQuestions.length ? 'Sudah dinilai' : 'Tanpa esai')) : '',
            Total_Skor: sub ? fin.total : '',
            Skor_Maksimal: sub ? Number(sub.maxTotalScore || 100) : '',
            Persentase: sub ? fin.percent : '',
            Status_KKTP: sub ? (fin.percent >= kktp ? 'Memenuhi KKTP' : 'Perlu Penguatan') : '',
            Pelanggaran_Tab: sub ? Number(sub.violations || 0) : '',
            Waktu_Submit: sub ? (sub.submittedAt || '') : ''
          };
        });
      }

      document.getElementById('btnExportRekapXlsx').addEventListener('click', () => {
        const ws = XLSX.utils.json_to_sheet(buildRekapRows());
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'RekapNilai');
        const suffix = selectedClass === 'ALL' ? 'Semua_Kelas' : `Kelas_${selectedClass}`;
        XLSX.writeFile(wb, `Rekap_Nilai_${suffix}_Informatika_XI.xlsx`);
        showToast('Rekap nilai diekspor ke .xlsx', 'success');
      });

      document.getElementById('btnExportRekapCsv').addEventListener('click', () => {
        const ws = XLSX.utils.json_to_sheet(buildRekapRows());
        const csv = XLSX.utils.sheet_to_csv(ws);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const suffix = selectedClass === 'ALL' ? 'Semua_Kelas' : `Kelas_${selectedClass}`;
        a.download = `Rekap_Nilai_${suffix}_Informatika_XI.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Rekap nilai diekspor ke .csv', 'success');
      });

      // ---- Tabel rekap per kelas (rinci per butir soal) ----
      function openRekapKelasOverlay() {
        const old = document.getElementById('rekapKelasOverlay');
        if (old) old.remove();
        const qs = rekapQsSnap;
        let cur = selectedClass !== 'ALL' ? selectedClass : (classList[0] || '');
        const ov = document.createElement('div');
        ov.id = 'rekapKelasOverlay';
        ov.className = 'fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-3 sm:p-6 overflow-auto';
        document.body.appendChild(ov);

        const compute = (cls) => {
          const studs = (state.students || []).filter((x) => String(x.kelas || '').trim() === cls)
            .slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'id'));
          const seen = new Set(studs.map((x) => String(x.nis).trim()));
          const rows = studs.map((x) => ({ nis: String(x.nis).trim(), name: x.name, sub: subByNis.get(String(x.nis).trim()) || null }));
          (state.submissions || []).forEach((sb) => {
            if (String(sb.kelas || '').trim() === cls && !seen.has(String(sb.nis).trim())) rows.push({ nis: String(sb.nis).trim(), name: sb.studentName, sub: sb });
          });
          rows.forEach((r) => { r.fin = r.sub ? computeFinalScore(r.sub) : null; });
          return rows;
        };
        const qScore = (sub, q) => {
          if (!sub) return '-';
          if (q.type === 'esai') {
            if (sub.essayScoresByQ && sub.essayScoresByQ[q.id] !== undefined) return String(Number(sub.essayScoresByQ[q.id]) || 0);
            return '*';
          }
          const it = sub.itemResults && sub.itemResults[q.id];
          return it ? String(Number(it.awarded) || 0) : '0';
        };

        const draw = () => {
          const rows = compute(cur);
          const done = rows.filter((r) => r.sub);
          const pc = done.map((r) => r.fin.percent);
          const avg = pc.length ? Math.round(pc.reduce((a, b) => a + b, 0) / pc.length) : null;
          const pass = done.filter((r) => r.fin.percent >= kktp).length;
          const th = 'sticky top-0 z-10 bg-slate-100 border-b border-slate-200 py-2.5 px-2.5 text-[11px] uppercase tracking-wider text-slate-600';
          const td = 'border-b border-slate-100 py-2 px-2.5';
          ov.innerHTML = `
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl my-auto">
              <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b border-slate-200">
                <div>
                  <h3 class="text-base font-bold text-slate-900">Rekap Nilai Siswa — Kelas ${escapeHtml(cur)}</h3>
                  <p class="text-xs text-slate-500">Skor per butir soal. Tanda <strong>*</strong> = esai belum dinilai. KKTP ${kktp}%.</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <select id="rkClassSel" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold text-slate-800">
                    ${classList.map((c) => `<option value="${escapeHtml(c)}" ${c === cur ? 'selected' : ''}>Kelas ${escapeHtml(c)}</option>`).join('')}
                  </select>
                  <button id="rkExport" type="button" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">Export .XLSX</button>
                  <button id="rkClose" type="button" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer">Tutup</button>
                </div>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 p-4 border-b border-slate-100">
                ${rekapChip('Jumlah Siswa', rows.length, 'bg-slate-50 border-slate-200 text-slate-800')}
                ${rekapChip('Sudah Mengerjakan', done.length + ' / ' + rows.length, 'bg-emerald-50 border-emerald-200 text-emerald-900')}
                ${rekapChip('Rata-rata Kelas', avg === null ? '-' : avg + '%', 'bg-sky-50 border-sky-200 text-sky-900')}
                ${rekapChip('Tuntas KKTP', pass + ' / ' + done.length, 'bg-amber-50 border-amber-200 text-amber-900')}
              </div>
              <div class="overflow-auto max-h-[65vh]">
                <table class="w-full text-left border-separate border-spacing-0 text-sm" style="min-width:${520 + qs.length * 52}px">
                  <thead><tr>
                    <th class="${th} text-center w-10">No</th>
                    <th class="${th} w-28">NIS</th>
                    <th class="${th}">Nama Siswa</th>
                    ${qs.map((q, i) => `<th class="${th} text-center" title="${escapeHtml(q.id)} • ${Number(q.points) || 0} poin">S${i + 1}<div class="font-normal text-slate-400 normal-case">/${Number(q.points) || 0}</div></th>`).join('')}
                    <th class="${th} text-center">Total</th>
                    <th class="${th} text-center">Nilai</th>
                    <th class="${th} text-center">Ket.</th>
                  </tr></thead>
                  <tbody>
                    ${rows.length === 0 ? `<tr><td colspan="${qs.length + 6}" class="py-10 text-center text-slate-500">Belum ada siswa pada kelas ini.</td></tr>` : rows.map((r, i) => {
                      const has = Boolean(r.sub);
                      const ok = has && r.fin.percent >= kktp;
                      return `<tr class="${i % 2 ? 'bg-slate-50/60' : 'bg-white'}">
                        <td class="${td} text-center font-mono text-xs text-slate-400">${i + 1}</td>
                        <td class="${td} font-mono text-[13px] font-semibold">${escapeHtml(r.nis)}</td>
                        <td class="${td} font-semibold text-slate-900">${escapeHtml(r.name)}</td>
                        ${qs.map((q) => `<td class="${td} text-center font-mono text-xs ${qScore(r.sub, q) === '0' ? 'text-rose-600' : ''}">${qScore(r.sub, q)}</td>`).join('')}
                        <td class="${td} text-center font-mono font-bold">${has ? r.fin.total + '<span class="text-slate-400 font-normal">/' + Number(r.sub.maxTotalScore || 100) + '</span>' : '-'}</td>
                        <td class="${td} text-center"><span class="px-2 py-0.5 rounded-lg text-xs font-extrabold ${!has ? 'text-slate-400' : ok ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${has ? r.fin.percent : '-'}</span></td>
                        <td class="${td} text-center text-xs font-semibold ${!has ? 'text-slate-400' : ok ? 'text-emerald-700' : 'text-amber-700'}">${!has ? 'Belum' : ok ? 'Tuntas' : 'Remidi'}</td>
                      </tr>`;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>`;
          document.getElementById('rkClose').addEventListener('click', () => ov.remove());
          document.getElementById('rkClassSel').addEventListener('change', (e) => { cur = e.target.value; draw(); });
          document.getElementById('rkExport').addEventListener('click', () => {
            const out = compute(cur).map((r, i) => {
              const o = { No: i + 1, NIS: r.nis, Nama: r.name, Kelas: cur };
              qs.forEach((q, k) => { o['S' + (k + 1) + ' (' + (Number(q.points) || 0) + ')'] = qScore(r.sub, q); });
              o.Total = r.sub ? r.fin.total : '';
              o.Nilai = r.sub ? r.fin.percent : '';
              o.Keterangan = !r.sub ? 'Belum mengerjakan' : (r.fin.percent >= kktp ? 'Tuntas' : 'Remidi');
              return o;
            });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(out), 'Kelas_' + String(cur).slice(0, 20));
            XLSX.writeFile(wb, `Rekap_Nilai_Kelas_${cur}.xlsx`);
            showToast('Rekap kelas ' + cur + ' diekspor.', 'success');
          });
        };
        ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
        draw();
      }
      document.getElementById('btnOpenRekapKelas').addEventListener('click', () => {
        if (!classList.length) { showToast('Belum ada data kelas.', 'warning'); return; }
        openRekapKelasOverlay();
      });

      document.getElementById('btnPrintRekap').addEventListener('click', () => {
        window.print();
      });
    }

    // -------------------------------------------------------------------------
    // KOREKSI ESAI (per soal, per kelas, satu siswa per layar)
    // -------------------------------------------------------------------------
    function renderAdminKoreksiTab(container) {
      const eqs = getEssayQuestions();
      if (eqs.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-sm text-slate-500">Belum ada soal esai di Bank Soal, jadi tidak ada yang perlu dikoreksi.</div>`;
        return;
      }
      if (!eqs.some((q) => q.id === state.koreksiQ)) state.koreksiQ = eqs[0].id;
      const eq = eqs.find((q) => q.id === state.koreksiQ);
      const selClass = state.koreksiClass || 'ALL';
      const mode = state.koreksiMode === 'semua' ? 'semua' : 'belum';
      const maxPts = Number(eq.points || 20);

      const classSet = new Set();
      (state.students || []).forEach((x) => { if (x && x.kelas) classSet.add(String(x.kelas).trim()); });
      (state.submissions || []).forEach((x) => { if (x && x.kelas) classSet.add(String(x.kelas).trim()); });
      const classList = Array.from(classSet).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));

      const inClass = (state.submissions || [])
        .filter((sub) => selClass === 'ALL' || String(sub.kelas || '').trim() === selClass)
        .slice()
        .sort((a, b) =>
          String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id', { numeric: true }) ||
          String(a.studentName || '').localeCompare(String(b.studentName || ''), 'id'));
      const gradedCount = inClass.filter((sub) => isEssayGraded(sub, eq.id)).length;
      const list = mode === 'belum' ? inClass.filter((sub) => !isEssayGraded(sub, eq.id)) : inClass;
      const idx = Math.min(Math.max(0, Number(state.koreksiIdx || 0)), Math.max(0, list.length - 1));
      state.koreksiIdx = idx;
      const cur = list[idx] || null;
      const pct = inClass.length ? Math.round((gradedCount / inClass.length) * 100) : 0;
      const pendingFor = (q) => (state.submissions || []).filter((sub) => !isEssayGraded(sub, q.id)).length;
      const keyText = String(eq.answerText || eq.pembahasan || eq.pembahasan_rubrik || '').trim();
      const selCls = 'px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-slate-800 focus:border-anbk-blue outline-none';
      const segBtn = (val, label) => `<button type="button" data-koreksi-mode="${val}" class="koreksi-mode-btn px-3.5 py-2 text-xs font-bold cursor-pointer transition ${mode === val ? 'bg-anbk-navy text-white' : 'bg-white text-slate-700 hover:bg-slate-100'}">${label}</button>`;

      let bodyHtml;
      if (inClass.length === 0) {
        bodyHtml = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-sm text-slate-500">Belum ada jawaban yang terkumpul${selClass === 'ALL' ? '' : ` pada Kelas ${escapeHtml(selClass)}`}.</div>`;
      } else if (!cur) {
        bodyHtml = `
          <div class="bg-white rounded-2xl p-8 text-center border border-emerald-200 space-y-3">
            <div class="text-base font-bold text-emerald-800">Semua jawaban pada filter ini sudah dinilai.</div>
            <p class="text-xs text-slate-500">${gradedCount} dari ${inClass.length} jawaban sudah memiliki skor.</p>
            <button type="button" data-koreksi-mode="semua" class="koreksi-mode-btn px-4 py-2 rounded-xl bg-anbk-navy hover:bg-anbk-navyDark text-white text-xs font-bold cursor-pointer">Tinjau semua jawaban</button>
          </div>`;
      } else {
        const ans = (cur.answers && cur.answers[eq.id]) ? String(cur.answers[eq.id]) : '';
        const graded = isEssayGraded(cur, eq.id);
        const curScore = graded ? Number(cur.essayScoresByQ[eq.id]) : '';
        bodyHtml = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="flex flex-wrap items-center justify-between gap-2 px-5 py-3 border-b border-slate-200 bg-slate-50/70">
              <div class="min-w-0">
                <div class="font-bold text-slate-900 truncate">${escapeHtml(cur.studentName)} <span class="font-mono text-xs text-slate-500">(${escapeHtml(cur.nis)} • ${escapeHtml(cur.kelas)})</span></div>
                <div class="text-xs text-slate-500">Jawaban ${idx + 1} dari ${list.length} • Pelanggaran tab: ${Number(cur.violations || 0)}x</div>
              </div>
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${graded ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${graded ? 'Sudah dinilai' : 'Belum dinilai'}</span>
            </div>
            <div class="p-5 space-y-4">
              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Jawaban siswa</div>
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 whitespace-pre-wrap min-h-[6rem] ${ans ? '' : 'italic text-slate-400'}">${ans ? escapeHtml(ans) : '(Tidak dijawab)'}</div>
              </div>
              <div class="flex flex-wrap items-end gap-3">
                <div>
                  <label for="koreksiScoreInput" class="block text-xs font-bold text-slate-700 mb-1">Skor (0 – ${maxPts})</label>
                  <input id="koreksiScoreInput" type="number" inputmode="decimal" min="0" max="${maxPts}" step="0.5" value="${curScore}" placeholder="0" class="w-28 px-3 py-2 rounded-xl border border-slate-300 bg-white text-lg font-mono font-bold focus:border-anbk-blue focus:ring-4 focus:ring-blue-500/10 outline-none" />
                </div>
                <div class="flex flex-wrap gap-1.5 pb-0.5">
                  <button type="button" data-quick-score="0" class="quick-score-btn px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">0</button>
                  <button type="button" data-quick-score="${maxPts / 2}" class="quick-score-btn px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">${maxPts / 2}</button>
                  <button type="button" data-quick-score="${maxPts}" class="quick-score-btn px-3 py-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-xs font-bold text-emerald-800 border border-emerald-200 cursor-pointer">Maks (${maxPts})</button>
                </div>
              </div>
              <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                <div class="flex gap-2">
                  <button id="koreksiPrevBtn" type="button" ${idx === 0 ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">&larr; Sebelumnya</button>
                  <button id="koreksiSkipBtn" type="button" ${idx >= list.length - 1 ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Lewati &rarr;</button>
                </div>
                <button id="koreksiSaveBtn" type="button" class="px-5 py-2.5 rounded-xl bg-anbk-blue hover:bg-blue-800 text-white text-sm font-bold cursor-pointer">Simpan &amp; Berikutnya</button>
              </div>
              <p class="text-[11px] text-slate-400">Tips: ketik skor lalu tekan Enter untuk menyimpan dan lanjut ke siswa berikutnya.</p>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-2">
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Loncat ke siswa <span class="normal-case font-medium text-slate-400">— hijau: sudah dinilai</span></div>
            <div class="flex flex-wrap gap-1.5 max-h-40 overflow-auto">
              ${list.map((sub, n) => {
                const g = isEssayGraded(sub, eq.id);
                const isCur = n === idx;
                return `<button type="button" data-koreksi-jump="${n}" title="${escapeHtml(sub.studentName)}" class="koreksi-jump-btn min-w-[2.25rem] px-2 py-1.5 rounded-lg text-xs font-bold cursor-pointer border ${isCur ? 'bg-anbk-navy text-white border-anbk-navy' : g ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">${n + 1}</button>`;
              }).join('')}
            </div>
          </div>`;
      }

      container.innerHTML = `
        <div class="space-y-5">
          <section class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
            <div>
              <h2 class="text-lg font-bold text-slate-900">Koreksi Esai</h2>
              <p class="text-xs text-slate-500">Nilai satu soal esai untuk satu kelas, siswa demi siswa. Hasilnya langsung masuk ke Rekap Nilai.</p>
            </div>
            <div class="flex flex-col sm:flex-row flex-wrap gap-3">
              ${eqs.length > 1 ? `
                <select id="koreksiQSelect" class="${selCls} sm:max-w-xs">
                  ${eqs.map((q, n) => `<option value="${escapeHtml(q.id)}" ${q.id === eq.id ? 'selected' : ''}>Esai ${n + 1} (${pendingFor(q)} belum dinilai)</option>`).join('')}
                </select>` : ''}
              <select id="koreksiClassSelect" class="${selCls}">
                <option value="ALL" ${selClass === 'ALL' ? 'selected' : ''}>Semua Kelas</option>
                ${classList.map((c) => `<option value="${escapeHtml(c)}" ${selClass === c ? 'selected' : ''}>Kelas ${escapeHtml(c)}</option>`).join('')}
              </select>
              <div class="inline-flex rounded-xl border border-slate-300 overflow-hidden">
                ${segBtn('belum', 'Belum dinilai')}
                ${segBtn('semua', 'Semua')}
              </div>
            </div>
            <div class="space-y-1.5">
              <div class="flex items-center justify-between text-xs text-slate-600">
                <span>Progres koreksi${selClass === 'ALL' ? '' : ` Kelas ${escapeHtml(selClass)}`}</span>
                <span><strong>${gradedCount}</strong> / ${inClass.length} dinilai (${pct}%)</span>
              </div>
              <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-emerald-500" style="width: ${pct}%"></div></div>
            </div>
            <div class="p-4 rounded-xl bg-sky-50/70 border border-sky-200 space-y-2">
              <div class="text-[11px] font-bold uppercase tracking-wider text-sky-800">Soal (maks ${maxPts} poin)</div>
              <div class="text-sm text-slate-800">${renderRichContent(eq.prompt)}</div>
              ${keyText ? `<details class="text-xs text-slate-700"><summary class="cursor-pointer font-bold text-sky-800">Kunci / pedoman penilaian</summary><div class="mt-1.5 whitespace-pre-wrap">${escapeHtml(keyText)}</div></details>` : ''}
            </div>
          </section>
          ${bodyHtml}
        </div>
      `;

      const rerender = (focusScore) => {
        saveState();
        renderAdminView();
        if (focusScore) {
          const inp = document.getElementById('koreksiScoreInput');
          if (inp) { inp.focus(); inp.select(); }
        }
      };

      const qSel = document.getElementById('koreksiQSelect');
      if (qSel) qSel.addEventListener('change', () => { state.koreksiQ = qSel.value; state.koreksiIdx = 0; rerender(false); });
      document.getElementById('koreksiClassSelect').addEventListener('change', (e) => { state.koreksiClass = e.target.value; state.koreksiIdx = 0; rerender(false); });
      document.querySelectorAll('.koreksi-mode-btn').forEach((btn) => {
        btn.addEventListener('click', () => { state.koreksiMode = btn.getAttribute('data-koreksi-mode'); state.koreksiIdx = 0; rerender(false); });
      });
      document.querySelectorAll('.koreksi-jump-btn').forEach((btn) => {
        btn.addEventListener('click', () => { state.koreksiIdx = parseInt(btn.getAttribute('data-koreksi-jump'), 10) || 0; rerender(true); });
      });

      if (cur) {
        const scoreInp = document.getElementById('koreksiScoreInput');
        document.querySelectorAll('.quick-score-btn').forEach((btn) => {
          btn.addEventListener('click', () => { scoreInp.value = btn.getAttribute('data-quick-score'); scoreInp.focus(); });
        });
        document.getElementById('koreksiPrevBtn').addEventListener('click', () => { state.koreksiIdx = idx - 1; rerender(true); });
        document.getElementById('koreksiSkipBtn').addEventListener('click', () => { state.koreksiIdx = idx + 1; rerender(true); });

        const saveCurrent = () => {
          if (String(scoreInp.value).trim() === '') {
            showToast('Isi skor dulu (boleh 0).', 'warning');
            scoreInp.focus();
            return;
          }
          let v = parseFloat(scoreInp.value);
          if (isNaN(v) || v < 0) v = 0;
          if (v > maxPts) v = maxPts;
          if (!cur.essayScoresByQ) cur.essayScoresByQ = {};
          cur.essayScoresByQ[eq.id] = v;
          cur.essayScore = Object.values(cur.essayScoresByQ).reduce((sum, x) => sum + Number(x || 0), 0);
          // Mode "belum": item ini hilang dari daftar, jadi indeks yang sama = siswa berikutnya.
          if (mode === 'semua') state.koreksiIdx = idx + 1;
          rerender(true);
        };
        document.getElementById('koreksiSaveBtn').addEventListener('click', saveCurrent);
        scoreInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveCurrent(); } });
      }
    }

    // -------------------------------------------------------------------------
    // ANALITIK BUTIR SOAL
    // -------------------------------------------------------------------------
    function renderAdminAnalitikTab(container) {
      const kktp = getKktp();
      const subs = state.submissions.slice();
      const totalSubs = subs.length;
      const pctOf = (s) => computeFinalScore(s).percent;
      const sorted = subs.slice().sort((a, b) => pctOf(b) - pctOf(a));
      const gN = Math.max(1, Math.round(sorted.length * 0.27));
      const upper = sorted.slice(0, gN);
      const lower = sorted.slice(-gN);
      const correctRate = (grp, qid) => {
        const r = grp.filter((s) => s.itemResults && s.itemResults[qid]);
        return r.length ? r.filter((s) => s.itemResults[qid].isCorrect).length / r.length : 0;
      };
      const atpAgg = {};
      const exportRows = [];

      // ---- Ringkasan statistik, reliabilitas (KR-20), butir bermasalah ----
      const pcts = subs.map(pctOf).sort((a, b) => a - b);
      const nS = pcts.length;
      const mean = nS ? pcts.reduce((a, b) => a + b, 0) / nS : 0;
      const median = nS ? (nS % 2 ? pcts[(nS - 1) / 2] : (pcts[nS / 2 - 1] + pcts[nS / 2]) / 2) : 0;
      const sd = nS > 1 ? Math.sqrt(pcts.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (nS - 1)) : 0;
      const tuntas = pcts.filter((v) => v >= kktp).length;
      const objQ = state.questions.filter((q) => q.type !== 'esai');
      const full = subs.filter((s) => s.itemResults && objQ.every((q) => s.itemResults[q.id]));
      let kr20 = null;
      if (objQ.length > 1 && full.length > 2) {
        const tot = full.map((s) => objQ.reduce((a, q) => a + (s.itemResults[q.id].isCorrect ? 1 : 0), 0));
        const tm = tot.reduce((a, b) => a + b, 0) / tot.length;
        const tv = tot.reduce((a, b) => a + (b - tm) * (b - tm), 0) / (tot.length - 1);
        const sumPQ = objQ.reduce((a, q) => { const pp = full.filter((s) => s.itemResults[q.id].isCorrect).length / full.length; return a + pp * (1 - pp); }, 0);
        if (tv > 0) kr20 = (objQ.length / (objQ.length - 1)) * (1 - sumPQ / tv);
      }
      const kr20Txt = kr20 === null ? 'n/a' : kr20.toFixed(2);
      const kr20Note = kr20 === null ? 'butuh ≥3 submisi lengkap' : kr20 >= 0.7 ? 'baik' : kr20 >= 0.5 ? 'cukup' : 'rendah';
      const flagged = [];
      if (totalSubs >= 4) {
        state.questions.forEach((q, i) => {
          if (q.type === 'esai') return;
          const dpq = correctRate(upper, q.id) - correctRate(lower, q.id);
          if (dpq < 0) flagged.push('#' + (i + 1) + ' (DP negatif: periksa kunci)');
          else if (dpq < 0.2) flagged.push('#' + (i + 1) + ' (DP rendah)');
        });
      }
      const times = subs.map((x) => Number(x.usedSeconds)).filter((v) => isFinite(v) && v > 0);
      const avgTimeTxt = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length / 60 * 10) / 10 + ' mnt' : 'n/a';
      const statHtml = `<div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
        ${[['Peserta', nS], ['Rata-rata', mean.toFixed(1)], ['Median', median.toFixed(1)], ['Simpangan baku', sd.toFixed(1)], ['Tertinggi / terendah', nS ? pcts[nS - 1] + ' / ' + pcts[0] : '-'], ['Tuntas (≥' + kktp + ')', nS ? tuntas + ' (' + Math.round(tuntas / nS * 100) + '%)' : '-'], ['Rata-rata waktu', avgTimeTxt]].map((x) => `<div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"><div class="text-[11px] text-slate-500 font-medium">${x[0]}</div><div class="text-sm font-extrabold text-slate-900">${x[1]}</div></div>`).join('')}
      </div>
      <div class="text-xs text-slate-600">Reliabilitas KR-20: <strong>${kr20Txt}</strong> (${kr20Note}). ${flagged.length ? 'Butir perlu ditinjau: <strong>' + escapeHtml(flagged.join(', ')) + '</strong>.' : (totalSubs >= 4 ? 'Tidak ada butir dengan daya pembeda bermasalah.' : '')} <button id="btnExportAnalitik" type="button" class="ml-2 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold cursor-pointer">Ekspor Excel</button></div>`;

      const rowsHtml = state.questions.map((q, idx) => {
        const prompt = `<div class="max-w-md line-clamp-3">${renderRichContent(q.prompt)}</div>`;
        if (q.type === 'esai') {
          return `<tr><td data-label="No" class="py-3 px-4 font-bold">#${idx + 1}</td><td data-label="Tipe" class="py-3 px-4 text-xs font-semibold text-slate-600">Esai</td><td data-label="Butir Soal" class="py-3 px-4 text-sm">${prompt}</td><td data-label="Benar / Salah" class="py-3 px-4 text-xs text-slate-500">Koreksi manual</td><td data-label="Kesukaran" class="py-3 px-4 text-xs text-slate-500">-</td><td data-label="Daya Pembeda" class="py-3 px-4 text-xs text-slate-500">-</td><td data-label="Pengecoh" class="py-3 px-4 text-xs text-slate-500">-</td></tr>`;
        }
        const res = subs.filter((s) => s.itemResults && s.itemResults[q.id]);
        const correct = res.filter((s) => s.itemResults[q.id].isCorrect).length;
        const p = res.length ? correct / res.length : 0;
        const pct = Math.round(p * 100);
        const dp = totalSubs >= 4 ? correctRate(upper, q.id) - correctRate(lower, q.id) : null;
        const dpTxt = dp === null ? 'n &lt; 4' : dp.toFixed(2);
        const dpCls = dp === null ? 'bg-slate-100 text-slate-600' : dp >= 0.3 ? 'bg-emerald-100 text-emerald-800' : dp >= 0.2 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800';
        const diff = pct > 70 ? 'Mudah' : pct < 30 ? 'Sukar' : 'Sedang';
        const diffCls = diff === 'Mudah' ? 'bg-emerald-100 text-emerald-800' : diff === 'Sukar' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800';
        let dist = '<span class="text-xs text-slate-400">-</span>';
        if (q.type === 'pg' && Array.isArray(q.options) && totalSubs) {
          const cnt = q.options.map((_, i) => subs.filter((s) => s.answers && Number(s.answers[q.id]) === i && s.answers[q.id] !== '' && s.answers[q.id] != null).length);
          dist = cnt.map((c, i) => `<span class="inline-block mr-1.5 text-xs ${i === Number(q.correctIndex) ? 'font-bold text-emerald-700' : (c > 0 && c >= correct ? 'font-bold text-rose-700' : 'text-slate-600')}">${String.fromCharCode(65 + i)}:${c}</span>`).join('');
        }
        if (q.type === 'pg_kompleks' && Array.isArray(q.options) && totalSubs) {
          const ci = (q.correctIndices || []).map(Number);
          const cntK = q.options.map((_, i) => subs.filter((x) => x.answers && Array.isArray(x.answers[q.id]) && x.answers[q.id].map(Number).includes(i)).length);
          dist = cntK.map((c, i) => `<span class="inline-block mr-1.5 text-xs ${ci.includes(i) ? 'font-bold text-emerald-700' : 'text-slate-600'}">${String.fromCharCode(65 + i)}:${c}</span>`).join('');
        }
        exportRows.push([idx + 1, q.type, String(q.prompt || '').replace(/<[^>]+>/g, '').slice(0, 200), correct, res.length, pct, dp === null ? '' : Number(dp.toFixed(2)), diff]);
        const atp = getQuestionAtp(q) || 'Tanpa ATP';
        (atpAgg[atp] = atpAgg[atp] || { c: 0, n: 0, items: 0 });
        atpAgg[atp].c += correct; atpAgg[atp].n += res.length; atpAgg[atp].items++;
        return `<tr><td data-label="No" class="py-3 px-4 font-bold">#${idx + 1}</td><td data-label="Tipe" class="py-3 px-4 text-xs font-semibold text-anbk-blue uppercase">${escapeHtml(q.type)}</td><td data-label="Butir Soal" class="py-3 px-4 text-sm">${prompt}</td><td data-label="Benar / Salah" class="py-3 px-4"><div class="text-xs font-semibold mb-1">Benar ${pct}% (${correct}/${res.length})</div><div class="w-full h-2 rounded-full bg-rose-100 overflow-hidden"><div class="h-full bg-emerald-600" style="width:${pct}%"></div></div></td><td data-label="Kesukaran" class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${diffCls}">${diff}</span></td><td data-label="Daya Pembeda" class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${dpCls}">${dpTxt}</span></td><td data-label="Pengecoh" class="py-3 px-4 font-mono">${dist}</td></tr>`;
      }).join('');

      const atpRows = Object.keys(atpAgg).sort().map((k) => {
        const a = atpAgg[k]; const pc = a.n ? Math.round((a.c / a.n) * 100) : 0; const ok = pc >= kktp;
        return `<tr><td class="py-2 px-4 font-mono text-xs font-semibold">${escapeHtml(k)}</td><td class="py-2 px-4 text-xs">${a.items} butir</td><td class="py-2 px-4 text-xs font-bold">${pc}%</td><td class="py-2 px-4"><span class="px-2 py-0.5 rounded-full text-xs font-bold ${ok ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${ok ? 'Tercapai' : 'Perlu penguatan'}</span></td></tr>`;
      }).join('');

      const bins = [0, 0, 0, 0, 0];
      subs.forEach((s) => { bins[Math.min(4, Math.floor(pctOf(s) / 20))]++; });
      const maxBin = Math.max(1, ...bins);
      const distHtml = bins.map((n, i) => `<div class="flex items-center gap-2 text-xs"><span class="w-16 font-mono text-slate-600">${i * 20}${i === 4 ? '-100' : '-' + (i * 20 + 19)}</span><div class="flex-1 h-4 rounded bg-slate-100 overflow-hidden"><div class="h-full bg-anbk-blue" style="width:${(n / maxBin) * 100}%"></div></div><span class="w-8 text-right font-bold">${n}</span></div>`).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-4">
            ${statHtml}
            <div><h2 class="text-lg font-bold text-slate-900">Analisis Butir Soal Objektif</h2>
            <p class="text-xs text-slate-500">Berdasarkan ${totalSubs} submisi. Daya pembeda = proporsi benar kelompok atas (27%) dikurangi kelompok bawah (27%); baik bila ≥ 0,30. Pada pengecoh, huruf hijau = kunci, merah = pengecoh paling menarik.</p></div>
            <div class="overflow-x-auto border border-slate-200 rounded-xl rt-wrap">
              <table class="rtable-sm w-full text-left border-collapse text-sm">
                <thead><tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-600"><th class="py-3 px-4">No</th><th class="py-3 px-4">Tipe</th><th class="py-3 px-4">Butir Soal</th><th class="py-3 px-4">Benar / Salah</th><th class="py-3 px-4">Kesukaran</th><th class="py-3 px-4">Daya Pembeda</th><th class="py-3 px-4">Pengecoh (PG)</th></tr></thead>
                <tbody class="divide-y divide-slate-100">${rowsHtml}</tbody>
              </table>
            </div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3">
              <h3 class="text-base font-bold text-slate-900">Ketercapaian per ATP <span class="text-xs font-normal text-slate-500">(KKTP ${kktp}%)</span></h3>
              <div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[11px] uppercase text-slate-600 bg-slate-50"><th class="py-2 px-4">ATP</th><th class="py-2 px-4">Butir</th><th class="py-2 px-4">Benar</th><th class="py-2 px-4">Status</th></tr></thead><tbody class="divide-y divide-slate-100">${atpRows || '<tr><td colspan="4" class="py-4 px-4 text-xs text-slate-500">Belum ada data.</td></tr>'}</tbody></table></div>
            </div>
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3">
              <h3 class="text-base font-bold text-slate-900">Distribusi Nilai</h3>
              <div class="space-y-1.5">${distHtml}</div>
            </div>
          </div>
        </div>`;
      const btnX = document.getElementById('btnExportAnalitik');
      if (btnX) btnX.addEventListener('click', () => {
        if (!window.XLSX) { showToast('Pustaka Excel belum termuat (butuh internet). Coba lagi.', 'warning'); return; }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['No', 'Tipe', 'Butir', 'Benar', 'Dijawab', '% Benar', 'Daya Pembeda', 'Kesukaran']].concat(exportRows)), 'Analisis Butir');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Peserta', nS], ['Rata-rata', Number(mean.toFixed(1))], ['Median', median], ['Simpangan baku', Number(sd.toFixed(1))], ['Tuntas', tuntas], ['KR-20', kr20 === null ? 'n/a' : Number(kr20.toFixed(2))]]), 'Ringkasan');
        XLSX.writeFile(wb, 'analisis_butir_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      });
    }

                  <span class="text-slate-800 flex-1 pt-0.5">${renderRichContent(optText)}</span>
                </label>
              `;
            }).join('')}
          </div>
        `;
      } else if (question.type === 'pg_kompleks') {
        const optOrder = (exam.optionMaps && exam.optionMaps[question.id])
          ? exam.optionMaps[question.id]
          : (question.options || []).map((_, i) => i);
        const selectedArr = Array.isArray(currentAns) ? currentAns.map(Number) : [];

        answerBodyHtml = `
          <div class="flex items-center gap-2 text-xs font-semibold text-amber-800 bg-amber-50 border border-amber-200/80 rounded-xl px-3.5 py-2.5 mb-3">
            <span>&#9745;</span>
            <span>Pilihan Ganda Kompleks — Anda dapat memilih lebih dari satu jawaban benar.</span>
          </div>
          <div class="space-y-3">
            ${optOrder.map((origIdx, dispIdx) => {
              const optText = (question.options || [])[origIdx] || '';
              const checked = selectedArr.includes(Number(origIdx));
              const letter = String.fromCharCode(65 + dispIdx);

                <label class="group flex items-start gap-3.5 p-4 rounded-2xl border cursor-pointer transition ${checked ? 'bg-blue-50/80 border-anbk-blue ring-2 ring-blue-500/20 shadow-2xs' : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50/70'}">
                  <input type="checkbox" data-pgk-val="${origIdx}" ${checked ? 'checked' : ''} class="mt-1 w-4 h-4 rounded text-anbk-blue" />

          ? exam.optionMaps[question.id]
          : pairs.map((p) => p.right);
        const matchObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};

        answerBodyHtml = `
          <div class="space-y-3">
            ${pairs.map((p, idx) => {
              const chosenRight = matchObj[idx] || '';
              return `
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center p-3.5 rounded-2xl bg-slate-50/80 border border-slate-200">
                  <div class="md:col-span-6 font-medium text-slate-800">${renderRichContent(p.left)}</div>
                  <div class="md:col-span-6">
                    <select data-match-row="${idx}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium focus:border-anbk-blue outline-none">

                    </select>

    function setupExamTimer() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      if (state.session.role !== 'student' || !state.session.activeExam) return;

      const exam = state.session.activeExam;
      const nowInit = Date.now();
      if (typeof exam.remainingMs !== 'number') {
        exam.remainingMs = Math.max(0, Number(exam.endTime) - nowInit);
      }
      exam.lastTickEpoch = nowInit;

      const tick = () => {
        const badge = document.getElementById('examTimerBadge');
        const currentExam = state.session.activeExam;
        if (!currentExam) {
          clearInterval(countdownInterval);
          return;
        }

        const now = Date.now();
        const prevEpoch = Number(currentExam.lastTickEpoch) || now;
        const deltaMs = now - prevEpoch;
        currentExam.lastTickEpoch = now;

        if (deltaMs > 0) {
          const safeStepMs = Math.min(deltaMs, 5000);
          currentExam.remainingMs = Math.max(0, Number(currentExam.remainingMs || 0) - safeStepMs);
          currentExam.endTime = now + currentExam.remainingMs;
        }

        if (currentExam.mode === 'latihan') { if (badge) badge.textContent = 'Tanpa Batas Waktu'; currentExam.remainingMs = 24 * 3600 * 1000; return; }
        const remainingMs = Math.max(0, Number(currentExam.remainingMs || 0));
        const totalSec = Math.floor(remainingMs / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (badge) {
          badge.textContent = formatted;
        }

        if (state.closeMode === 'auto') {
          const cw = getClassWindow(currentExam.kelas);
          if (cw.end && now > new Date(cw.end).getTime()) {
            clearInterval(countdownInterval);
            showToast('Jadwal ujian telah ditutup. Jawaban dikumpulkan otomatis.', 'warning');
            finalizeExamSubmission(true);
            return;
          }
        }

        if (remainingMs <= 0) {
          clearInterval(countdownInterval);
          const autoSubmitEnabled = state.antiCheat ? (state.antiCheat.autoSubmitOnTimeout !== false) : true;
          if (autoSubmitEnabled) {
            showToast('Waktu ujian telah berakhir. Jawaban dikumpulkan otomatis.', 'warning');
            finalizeExamSubmission(true);
          } else {
            showToast('Waktu ujian telah berakhir.', 'warning');
          }
        }
      };

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    function setupTokenRotation() {
      if (tokenRotateInterval) {
        clearInterval(tokenRotateInterval);
        tokenRotateInterval = null;
      }
      if (tokenCountdownInterval) {
        clearInterval(tokenCountdownInterval);
        tokenCountdownInterval = null;
      }

      if (state.autoRotateToken) {
        const intervalMins = Math.max(1, Number(state.tokenRotateIntervalMinutes) || 5);
        if (!state.tokenNextRotateAt) {
          state.tokenNextRotateAt = Date.now() + intervalMins * 60 * 1000;
          saveState();
        }

        tokenRotateInterval = setInterval(() => {
          if (!state.autoRotateToken) return;
          const now = Date.now();
          if (now >= Number(state.tokenNextRotateAt || 0)) {
            const newTok = rotateExamToken(`Auto-Rotate (${intervalMins}m)`);
            if (state.session.role === 'admin') {
              renderHeader();
              const tokInp = document.getElementById('cfgToken');
              if (tokInp) tokInp.value = newTok;
              const dispEl = document.getElementById('secActiveTokenDisplay');
              if (dispEl) dispEl.textContent = newTok;
            }
            showToast(`Token ujian otomatis diperbarui: ${newTok}`, 'info');
          }
        }, 1000);
      }

      tokenCountdownInterval = setInterval(() => {
        const cdBadge = document.getElementById('tokenCountdownBadge');
        if (!cdBadge) return;
        if (!state.autoRotateToken || !state.tokenNextRotateAt) {
          cdBadge.textContent = 'Rotasi Manual';
          return;
        }
        const remSec = Math.max(0, Math.floor((Number(state.tokenNextRotateAt) - Date.now()) / 1000));
        const m = Math.floor(remSec / 60);
        const s = remSec % 60;
        cdBadge.textContent = `Rotasi dlm ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }, 1000);
    }

    function handleAntiCheatViolation(triggerSource) {
      if (!state || !state.session || state.session.role !== 'student' || !state.session.activeExam) return;
      const ac = state.antiCheat || createInitialState().antiCheat;
      if (!ac.tabSwitchDetection) return;
      if (state.session.activeExam.mode === 'latihan') return;

      const now = Date.now();
      if (now - lastViolationTimestamp < 1200) return;
      lastViolationTimestamp = now;

      const exam = state.session.activeExam;
      exam.violations = (Number(exam.violations) || 0) + 1;
      const stu = state.students.find((s) => String(s.nis).trim() === String(exam.nis).trim());
      if (stu) {
        stu.violations = exam.violations;
        if (!Array.isArray(stu.violationLogs)) stu.violationLogs = [];
        stu.violationLogs.unshift({
          time: new Date().toLocaleTimeString('id-ID'),
          source: triggerSource,
          count: exam.violations
        });
      }

      appendAntiCheatLog({
        nis: exam.nis,
        studentName: exam.studentName,
        kelas: exam.kelas,
        event: `Pelanggaran Anti-Curang (${triggerSource})`,
        detail: `Pelanggaran ke-${exam.violations} (Batas toleransi: ${Number(ac.maxViolations || 3)})`
      });

      const maxViol = Math.max(1, Number(ac.maxViolations) || 3);
      if (exam.violations >= maxViol) {
        if (ac.actionMode === 'auto_submit') {
          saveState();
          showToast('Batas pelanggaran tercapai! Ujian dikumpulkan otomatis.', 'danger');
          finalizeExamSubmission(true);
          return;
        }
        if (ac.actionMode === 'lock') {
          exam.lockedByAntiCheat = true;
          exam.lockReason = `Layar dikunci otomatis setelah ${exam.violations}x pelanggaran (${triggerSource}).`;
          if (stu) {
            stu.locked = true;
            stu.status = 'terkunci';
          }
          appendAntiCheatLog({
            nis: exam.nis,
            studentName: exam.studentName,
            kelas: exam.kelas,
            event: 'Layar Terkunci Otomatis',
            detail: `Melewati batas ${maxViol}x pelanggaran (${triggerSource})`
          });
          saveState();
          renderStudentExamView();
          openModal(`
            <h3 class="text-lg font-bold text-rose-800">Layar Ujian Dikunci Sistem!</h3>
            <p class="text-sm text-slate-600">Anda terdeteksi keluar/berpindah layar sebanyak <strong>${exam.violations}x</strong> (${escapeHtml(triggerSource)}). Hubungi pengawas untuk membuka kunci layar.</p>
            <div class="flex justify-end pt-2">
              <button id="btnAckLockModal" type="button" class="px-4 py-2 rounded-xl bg-rose-700 text-white text-sm font-bold cursor-pointer">Mengerti</button>
            </div>
          `);
          document.getElementById('btnAckLockModal').addEventListener('click', closeModal);
          return;
        }
      }

      saveState();
      showToast(`Peringatan Anti-Curang (${triggerSource}): Pelanggaran ke-${exam.violations}/${maxViol}!`, 'danger');
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        handleAntiCheatViolation('Pindah Tab / Keluar Layar');
      }
    });

    window.addEventListener('blur', () => {
      // Notifikasi sekilas / papan ketik HP tidak dihitung; hanya bila fokus tetap hilang >2,5 dtk

      setTimeout(() => {

      }, 2500);
    });

    window.addEventListener('pagehide', () => {

    function renderApp() {

    window.addEventListener('DOMContentLoaded', () => {

      renderApp();

    function topikList(src) {
      const m = new Map();
      (src || state.questions || []).forEach((q) => {
        const t = topikOf(q);
        const o = m.get(t) || { name: t, count: 0, pts: 0 };
        o.count++; o.pts += Number(q.points) || 0;
        m.set(t, o);
      });
      return Array.from(m.values()).sort((a, b) => a.name.localeCompare(b.name, 'id', { numeric: true }));
    }
    function questionsForTopik(t) {
      if (!t) return state.questions || [];
      return (state.questions || []).filter((q) => topikOf(q) === t);
    }
    function renameTopik(oldN, rawNew) {
      const newN = canonTopik(rawNew);
      if (!newN) return { ok: false, msg: 'Nama topik tidak boleh kosong.' };
      if (newN === oldN) return { ok: false, msg: 'Nama topik tidak berubah.' };
      const mine = visibleQuestions().filter((q) => topikOf(q) === oldN);
      mine.forEach((q) => { q.topik = newN; });
      (state.autoSoalDraft || []).forEach((d) => { if (topikOf(d) === oldN) d.topik = newN; });
      const stillOld = (state.questions || []).some((q) => topikOf(q) === oldN);
      if (!stillOld) {
        const cfg = state.topikConfig || (state.topikConfig = {});
        if (!cfg[newN] && cfg[oldN]) cfg[newN] = cfg[oldN];
        delete cfg[oldN];
        const meta = state.topikMeta || (state.topikMeta = {});
        if (!meta[newN] && meta[oldN]) meta[newN] = meta[oldN];
        delete meta[oldN];
        (state.submissions || []).forEach((s) => { if (String(s.topik || '') === oldN) s.topik = newN; });
        if (state.hasilTopik === oldN) state.hasilTopik = newN;
      }
      saveState();
      return { ok: true, n: mine.length, name: newN };
    }
    function topikCfg(name) { return (state.topikConfig && state.topikConfig[name]) || null; }
    function topikTokenTaken(tok, exceptName) {
      const cfg = state.topikConfig || {};
      return Object.keys(cfg).some((n) => n !== exceptName && String((cfg[n] || {}).token || '').toUpperCase() === String(tok).toUpperCase());
    }
    function newTopikToken(exceptName) {
      let t, n = 0;
      do { t = generateExamToken(); n++; } while (topikTokenTaken(t, exceptName) && n < 50);
      return t;
    }
    function syncTopikConfig() {
      if (!state.topikConfig || typeof state.topikConfig !== 'object') state.topikConfig = {};
      let changed = false;
      topikList().forEach((tp) => {
        const c = state.topikConfig[tp.name];
        if (!c) { state.topikConfig[tp.name] = { active: false, token: newTopikToken(tp.name), duration: 0 }; changed = true; }
        else if (!c.token) { c.token = newTopikToken(tp.name); changed = true; }
      });
      return changed;
    }
    function topikDurationMinutes(t) {
      const c = t ? topikCfg(t) : null;
      const d = c ? Number(c.duration) : 0;
      return d > 0 ? d : (Number(state.durationMinutes) || 30);
    }
    function resolveTokenTopic(token) {
      const tok = String(token || '').trim().toUpperCase();
      const cfg = state.topikConfig || {};
      const names = Object.keys(cfg);
      if (!names.length) {
        if (tok === String(state.examToken).trim().toUpperCase()) return { ok: true, topik: '' };
        return { ok: false, msg: 'Token ujian salah! Periksa token aktif dari pengawas.' };
      }
      const name = names.find((n) => String((cfg[n] || {}).token || '').toUpperCase() === tok);
      if (!name) return { ok: false, msg: 'Token ujian salah! Periksa token aktif dari pengawas.' };
      if (!cfg[name].active) return { ok: false, msg: 'Ujian topik "' + name + '" sedang dinonaktifkan oleh guru/pengawas.' };
      if (!questionsForTopik(name).length) return { ok: false, msg: 'Topik "' + name + '" belum memiliki soal.' };
      return { ok: true, topik: name };
    }

    // Penilaian hanya atas soal milik topik ujian
    (function () {

      countPendingEssay = function () {

        }));
        return n;
      };
    })();

    // Panel Topik & Token di menu Bank Soal
    (function () {

        const save = () => { saveState(); paint(); };
        box.querySelectorAll('[data-tp-toggle]').forEach((b) => b.addEventListener('click', () => {
          const c = topikCfg(b.getAttribute('data-tp-toggle')); if (!c) return;

          c.token = v; save();
        }));
        box.querySelectorAll('[data-tp-dur]').forEach((i) => i.addEventListener('change', () => {
          const c = topikCfg(i.getAttribute('data-tp-dur')); if (!c) return;
          c.duration = Math.max(0, Math.min(240, parseInt(i.value, 10) || 0)); save();
        }));
        box.querySelectorAll('[data-tp-mode]').forEach((i) => i.addEventListener('change', () => {
          const c = topikCfg(i.getAttribute('data-tp-mode')); if (!c) return;
          c.mode = i.value === 'latihan' ? 'latihan' : 'ujian'; save();
        }));
        box.querySelectorAll('[data-tp-review]').forEach((i) => i.addEventListener('change', () => {
          const c = topikCfg(i.getAttribute('data-tp-review')); if (!c) return;
          c.review = i.checked; save();
        }));
        const setMeta = (nm, k, v) => { if (!state.topikMeta) state.topikMeta = {}; state.topikMeta[nm] = Object.assign({ jenis: '', pengalaman: '' }, state.topikMeta[nm], { [k]: v }); saveState(); };
        box.querySelectorAll('[data-tp-jenis]').forEach((i) => i.addEventListener('change', () => setMeta(i.getAttribute('data-tp-jenis'), 'jenis', i.value)));
        box.querySelectorAll('[data-tp-peng]').forEach((i) => i.addEventListener('change', () => setMeta(i.getAttribute('data-tp-peng'), 'pengalaman', i.value)));
        box.querySelectorAll('[data-tp-ren]').forEach((b) => b.addEventListener('click', () => {
          const oldN = b.getAttribute('data-tp-ren');
          openModal(`<h3 class="text-lg font-bold text-slate-900">Ubah nama topik</h3>
            <p class="text-sm text-slate-700">Soal, token, durasi, dan nilai siswa yang sudah tersimpan pada topik <strong>${escapeHtml(oldN)}</strong> ikut dipindahkan ke nama baru. Bila nama baru sudah ada, kedua topik digabung dan pengaturan token memakai milik topik tujuan.</p>
            <input id="tpRenInput" type="text" maxlength="80" value="${escapeHtml(oldN)}" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
            <div class="flex justify-end gap-2 pt-3"><button id="tpRenCancel" type="button" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold cursor-pointer">Batal</button><button id="tpRenOk" type="button" class="px-4 py-2 rounded-xl bg-anbk-blue hover:bg-blue-800 text-white text-sm font-bold cursor-pointer">Simpan</button></div>`);
          document.getElementById('tpRenCancel').addEventListener('click', closeModal);
          document.getElementById('tpRenOk').addEventListener('click', () => {
            const r = renameTopik(oldN, document.getElementById('tpRenInput').value);
            if (!r.ok) { showToast(r.msg, 'warning'); return; }
            closeModal(); renderAdminView();
            showToast('Topik diubah menjadi "' + r.name + '" (' + r.n + ' soal).', 'success');
          });

        const setAll = (v) => { topics.forEach((tp) => { const c = topikCfg(tp.name); if (c) c.active = v; }); save(); };
        const on = document.getElementById('tpAllOn'); if (on) on.addEventListener('click', () => setAll(true));
        const off = document.getElementById('tpAllOff'); if (off) off.addEventListener('click', () => setAll(false));
      }
      renderAdminSoalTab = function (container) {

        paint();
      };
    })();

    // Skor terskala pada Analitik (dipasang sebelum filter topik agar memakai soal/submission topik terpilih)
    (function () {
      const prevA = renderAdminAnalitikTab;
      renderAdminAnalitikTab = function (container) { prevA(container); try { appendRasch(container); } catch (e) { /* abaikan */ } };
    })();

    // Filter topik pada Koreksi Esai, Rekap Nilai, dan Analitik (nilai tiap topik tersimpan terpisah)
    (function () {
      function opts() {
        const set = new Set();
        (state.questions || []).forEach((q) => set.add(topikOf(q)));
        (state.submissions || []).forEach((x) => set.add(String(x.topik || '')));
        return Array.from(set).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
      }
      function wrap(orig) {
        return function (container) {
          const list = opts();
          if (list.length <= 1) { orig(container); return; }
          let sel = state.hasilTopik;
          if (list.indexOf(sel) < 0) sel = list[0];
          state.hasilTopik = sel;
          container.innerHTML = '<div class="mb-4 p-3 rounded-2xl bg-white border border-slate-200 flex flex-wrap items-center gap-1.5"><span class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mr-1">Topik / Ujian:</span>'
            + list.map((t) => `<button type="button" data-hasil-topik="${escapeHtml(t)}" class="px-3 py-1.5 rounded-full border text-xs font-bold cursor-pointer ${t === sel ? 'bg-anbk-blue border-anbk-blue text-white' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-100'}">${escapeHtml(t || 'Data lama (tanpa topik)')}</button>`).join('')
            + '</div><div id="hasilTopikInner"></div>';
          container.querySelectorAll('[data-hasil-topik]').forEach((b) => b.addEventListener('click', () => {
            state.hasilTopik = b.getAttribute('data-hasil-topik'); saveState(); renderAdminView();
          }));
          const sq = state.questions, ss = state.submissions;
          state.questions = sel ? sq.filter((q) => topikOf(q) === sel) : sq;
          state.submissions = ss.filter((x) => String(x.topik || '') === sel);
          try { orig(document.getElementById('hasilTopikInner')); }
          finally { state.questions = sq; state.submissions = ss; }
        };
      }
      renderAdminRekapTab = wrap(renderAdminRekapTab);
      renderAdminKoreksiTab = wrap(renderAdminKoreksiTab);
      renderAdminAnalitikTab = wrap(renderAdminAnalitikTab);
    })();

    // =========================================================================
    // FITUR LANJUTAN BANK SOAL: impor Word/Teks, prompt AI, soal dinamis, mode latihan,
    // pembahasan & analisis kelemahan, skor terskala (Rasch/PROX), mode ujian ketat
    // =========================================================================
    const IMP_TYPE_MAP = { PG: 'pg', PGK: 'pg_kompleks', BS: 'pgk_kategori', JODOH: 'menjodohkan', ISIAN: 'isian', ESAI: 'esai' };
    const IMP_DEF_PTS = { pg: 10, pg_kompleks: 15, pgk_kategori: 15, menjodohkan: 15, isian: 15, esai: 20 };
    const IMP_TYPE_LBL = { pg: 'PG', pg_kompleks: 'PG Kompleks', pgk_kategori: 'Benar/Salah', menjodohkan: 'Menjodohkan', isian: 'Isian', esai: 'Esai' };
    function impAtpList() {
      return FASE_F_CURRICULUM.reduce((a, el) => a.concat(el.atpList.map((x) => Object.assign({ elemen: el.elemen }, x))), []);
    }
    function topikModeOf(t) { const c = t ? topikCfg(t) : null; return c && c.mode === 'latihan' ? 'latihan' : 'ujian'; }

    function parseSoalText(text, defTopik) {
      const lines = String(text || '').replace(/\r/g, '').split('\n');
      const blocks = [];
      let cur = null;
      const tagRe = /^\s*(?:\d+[.)]\s*)?\[(PG|PGK|BS|JODOH|ISIAN|ESAI)\]\s*(.*)$/i;
      const numRe = /^\s*\d+[.)]\s+(.*)$/;
      const metaRe = /^(topik|poin|bobot|level|atp)\s*[:=]\s*(.+)$/i;
      const keyRe = /^(kunci(?:\s*jawaban)?|jawaban)\s*[:=]\s*(.+)$/i;
      const pembRe = /^(pembahasan|rubrik|penjelasan)\s*[:=]\s*(.*)$/i;
      const optRe = /^([A-Ha-h])[.)]\s+(.+)$/;
      const itemRe = /^[-*•]\s*(.+?)\s*(?:=>|→|::)\s*(.+)$/;
      const fresh = (tag) => ({ tag: tag || null, meta: {}, prompt: [], options: [], key: '', pemb: '', items: [], sawKey: false, mode: 'prompt', n: blocks.length + 1 });
      lines.forEach((raw) => {
        const line = raw.trim();
        if (!line) return;
        let m = line.match(tagRe);
        if (m) {
          cur = fresh(m[1].toUpperCase()); blocks.push(cur);
          m[2].split('|').forEach((p) => {
            p = p.trim(); if (!p) return;
            const mm = p.match(metaRe);
            if (mm) cur.meta[mm[1].toLowerCase()] = mm[2].trim(); else cur.prompt.push(p);
          });
          return;
        }
        if (!cur || cur.sawKey) {
          const nm = line.match(numRe);
          if (nm) { cur = fresh(null); blocks.push(cur); cur.prompt.push(nm[1]); return; }
          if (!cur) return;
        }
        if ((m = line.match(pembRe))) { cur.pemb = m[2]; cur.mode = 'pemb'; cur.sawKey = true; return; }
        if ((m = line.match(keyRe))) { cur.key = m[2].trim(); cur.sawKey = true; cur.mode = 'key'; return; }
        if ((m = line.match(metaRe))) { cur.meta[m[1].toLowerCase()] = m[2].trim(); return; }
        if (cur.mode === 'pemb') { cur.pemb += ' ' + line; return; }
        if (!cur.items.length && (m = line.match(optRe))) { cur.options.push(m[2].trim()); cur.mode = 'opt'; return; }
        if ((m = line.match(itemRe))) { cur.items.push([m[1].trim(), m[2].trim()]); cur.mode = 'items'; return; }
        if (cur.mode === 'opt' && !cur.sawKey && cur.options.length) { cur.options[cur.options.length - 1] += ' ' + line; return; }
        if (!cur.sawKey && !cur.options.length && !cur.items.length) cur.prompt.push(line);
      });

      const atps = impAtpList();
      const ok = [], err = [];
      blocks.forEach((b, i) => {
        const prompt = b.prompt.join('\n').trim();
        if (!prompt) { err.push('Soal #' + b.n + ': teks soal kosong.'); return; }
        const keyLetters = Array.from(new Set((b.key.toUpperCase().match(/[A-H]/g) || [])));
        let type = b.tag ? IMP_TYPE_MAP[b.tag] : null;
        if (!type) {
          if (b.options.length >= 2) type = keyLetters.length > 1 ? 'pg_kompleks' : 'pg';
          else if (b.items.length) type = b.items.every((it) => /^(benar|salah|b|s|true|false)$/i.test(it[1])) ? 'pgk_kategori' : 'menjodohkan';
          else if (b.key) type = 'isian'; else type = 'esai';
        }
        const q = { id: 'Q_IMP_' + Date.now() + '_' + i, type, prompt, points: parseInt(b.meta.poin || b.meta.bobot, 10) || IMP_DEF_PTS[type] };
        if (type === 'pg') {
          if (b.options.length < 2) { err.push('Soal #' + b.n + ': PG butuh minimal 2 opsi (A., B., ...).'); return; }
          const idx = keyLetters.length === 1 ? keyLetters[0].charCodeAt(0) - 65 : -1;
          if (idx < 0 || idx >= b.options.length) { err.push('Soal #' + b.n + ': "Kunci:" PG harus satu huruf yang sesuai opsi.'); return; }
          q.options = b.options; q.correctIndex = idx;
        } else if (type === 'pg_kompleks') {
          const idxs = keyLetters.map((l) => l.charCodeAt(0) - 65).filter((x) => x >= 0 && x < b.options.length);
          if (b.options.length < 2 || !idxs.length) { err.push('Soal #' + b.n + ': PG Kompleks butuh opsi dan "Kunci:" seperti A,C.'); return; }
          q.options = b.options; q.correctIndices = idxs.sort((x, y) => x - y);
        } else if (type === 'pgk_kategori') {
          const st = b.items.map((it) => ({ text: it[0], answer: /^(benar|b|true)$/i.test(it[1]) ? 'Benar' : 'Salah' }));
